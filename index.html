<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ARTIVUS — 创意空间</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Noto+Serif+SC:wght@400;700&family=Inter:wght@300;400;500&display=swap");

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        background: #0a0a0a;
        display: flex;
        font-family: "Inter", "Noto Serif SC", sans-serif;
        overflow: hidden;
      }

      /* ===== 左侧艺术展示区 ===== */
      .art-panel {
        flex: 1.2;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      .art-panel::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(
            ellipse at 20% 50%,
            rgba(139, 92, 246, 0.15) 0%,
            transparent 50%
          ),
          radial-gradient(
            ellipse at 80% 20%,
            rgba(244, 63, 94, 0.1) 0%,
            transparent 50%
          ),
          radial-gradient(
            ellipse at 60% 80%,
            rgba(59, 130, 246, 0.1) 0%,
            transparent 50%
          );
        z-index: 1;
      }

      /* 动态艺术背景 */
      .art-canvas {
        position: absolute;
        inset: 0;
        z-index: 0;
      }

      .floating-shape {
        position: absolute;
        border-radius: 50%;
        filter: blur(60px);
        opacity: 0.6;
        animation: floatShape 20s ease-in-out infinite;
      }

      .shape-1 {
        width: 400px;
        height: 400px;
        background: linear-gradient(135deg, #667eea, #764ba2);
        top: -10%;
        left: -5%;
        animation-delay: 0s;
        animation-duration: 25s;
      }

      .shape-2 {
        width: 300px;
        height: 300px;
        background: linear-gradient(135deg, #f093fb, #f5576c);
        bottom: -5%;
        right: 10%;
        animation-delay: -5s;
        animation-duration: 20s;
      }

      .shape-3 {
        width: 250px;
        height: 250px;
        background: linear-gradient(135deg, #4facfe, #00f2fe);
        top: 40%;
        left: 30%;
        animation-delay: -10s;
        animation-duration: 22s;
      }

      .shape-4 {
        width: 200px;
        height: 200px;
        background: linear-gradient(135deg, #ffecd2, #fcb69f);
        top: 10%;
        right: 20%;
        animation-delay: -7s;
        animation-duration: 18s;
      }

      @keyframes floatShape {
        0%,
        100% {
          transform: translate(0, 0) rotate(0deg) scale(1);
        }
        25% {
          transform: translate(50px, -50px) rotate(90deg) scale(1.1);
        }
        50% {
          transform: translate(-30px, 30px) rotate(180deg) scale(0.9);
        }
        75% {
          transform: translate(40px, 40px) rotate(270deg) scale(1.05);
        }
      }

      /* 艺术画框效果 */
      .gallery-frame {
        position: relative;
        z-index: 2;
        width: 380px;
        height: 480px;
        border: 2px solid rgba(255, 255, 255, 0.1);
        padding: 12px;
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(10px);
        transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1);
      }

      .gallery-frame:hover {
        transform: perspective(1000px) rotateY(-5deg) rotateX(3deg);
      }

      .frame-inner {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        padding: 30px;
      }

      .frame-inner::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          135deg,
          #1a1a2e 0%,
          #16213e 25%,
          #0f3460 50%,
          #533483 75%,
          #e94560 100%
        );
        background-size: 400% 400%;
        animation: gradientShift 8s ease infinite;
      }

      @keyframes gradientShift {
        0%,
        100% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
      }

      /* 几何装饰 */
      .geo-line {
        position: absolute;
        background: rgba(255, 255, 255, 0.08);
      }

      .geo-line-1 {
        width: 1px;
        height: 120px;
        top: 30px;
        left: 40px;
        animation: geoFade 4s ease-in-out infinite;
      }

      .geo-line-2 {
        width: 80px;
        height: 1px;
        top: 30px;
        left: 40px;
        animation: geoFade 4s ease-in-out infinite;
        animation-delay: 1s;
      }

      .geo-line-3 {
        width: 1px;
        height: 80px;
        bottom: 50px;
        right: 50px;
        animation: geoFade 4s ease-in-out infinite;
        animation-delay: 2s;
      }

      .geo-line-4 {
        width: 60px;
        height: 1px;
        bottom: 50px;
        right: 50px;
        animation: geoFade 4s ease-in-out infinite;
        animation-delay: 3s;
      }

      .geo-circle {
        position: absolute;
        width: 150px;
        height: 150px;
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 50%;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        animation: geoRotate 30s linear infinite;
      }

      .geo-circle-2 {
        width: 200px;
        height: 200px;
        animation-direction: reverse;
        animation-duration: 25s;
      }

      .geo-diamond {
        position: absolute;
        width: 60px;
        height: 60px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        top: 25%;
        right: 25%;
        transform: rotate(45deg);
        animation: geoPulse 6s ease-in-out infinite;
      }

      @keyframes geoFade {
        0%,
        100% {
          opacity: 0.3;
        }
        50% {
          opacity: 1;
        }
      }

      @keyframes geoRotate {
        from {
          transform: translate(-50%, -50%) rotate(0deg);
        }
        to {
          transform: translate(-50%, -50%) rotate(360deg);
        }
      }

      @keyframes geoPulse {
        0%,
        100% {
          transform: rotate(45deg) scale(1);
          opacity: 0.3;
        }
        50% {
          transform: rotate(45deg) scale(1.2);
          opacity: 0.8;
        }
      }

      .artwork-info {
        position: relative;
        z-index: 2;
      }

      .artwork-number {
        font-family: "Playfair Display", serif;
        font-size: 11px;
        letter-spacing: 4px;
        color: rgba(255, 255, 255, 0.4);
        text-transform: uppercase;
        margin-bottom: 12px;
      }

      .artwork-title {
        font-family: "Playfair Display", serif;
        font-size: 28px;
        color: rgba(255, 255, 255, 0.9);
        line-height: 1.3;
        margin-bottom: 8px;
        font-style: italic;
      }

      .artwork-artist {
        font-size: 12px;
        color: rgba(255, 255, 255, 0.4);
        letter-spacing: 2px;
      }

      /* 导航点 */
      .gallery-nav {
        position: absolute;
        bottom: 40px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 3;
        display: flex;
        gap: 12px;
      }

      .nav-dot {
        width: 8px;
        height: 8px;
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .nav-dot.active {
        background: rgba(255, 255, 255, 0.8);
        border-color: rgba(255, 255, 255, 0.8);
        box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
      }

      .nav-dot:hover {
        background: rgba(255, 255, 255, 0.5);
      }

      /* 品牌水印 */
      .brand-watermark {
        position: absolute;
        top: 40px;
        left: 40px;
        z-index: 3;
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .brand-logo {
        width: 40px;
        height: 40px;
        border: 1.5px solid rgba(255, 255, 255, 0.2);
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
      }

      .brand-logo::before {
        content: "";
        width: 16px;
        height: 16px;
        background: linear-gradient(135deg, #667eea, #764ba2);
        border-radius: 50%;
      }

      .brand-logo::after {
        content: "";
        position: absolute;
        width: 10px;
        height: 10px;
        border-right: 1.5px solid rgba(255, 255, 255, 0.4);
        border-bottom: 1.5px solid rgba(255, 255, 255, 0.4);
        bottom: -5px;
        right: -5px;
      }

      .brand-name {
        font-family: "Playfair Display", serif;
        font-size: 18px;
        color: rgba(255, 255, 255, 0.7);
        letter-spacing: 6px;
        font-weight: 400;
      }

      /* ===== 右侧登录区 ===== */
      .login-panel {
        flex: 0.8;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        background: #0f0f0f;
        border-left: 1px solid rgba(255, 255, 255, 0.06);
      }

      .login-panel::before {
        content: "";
        position: absolute;
        top: 0;
        left: -1px;
        width: 1px;
        height: 100%;
        background: linear-gradient(
          to bottom,
          transparent,
          rgba(139, 92, 246, 0.3) 30%,
          rgba(244, 63, 94, 0.3) 70%,
          transparent
        );
      }

      /* 背景纹理 */
      .texture-overlay {
        position: absolute;
        inset: 0;
        opacity: 0.03;
        background-image:
          radial-gradient(circle at 25% 25%, white 1px, transparent 1px),
          radial-gradient(circle at 75% 75%, white 1px, transparent 1px);
        background-size: 50px 50px;
      }

      .login-container {
        width: 100%;
        max-width: 380px;
        padding: 40px;
        position: relative;
        z-index: 2;
      }

      /* 顶部装饰 */
      .login-header {
        margin-bottom: 50px;
        text-align: center;
      }

      .header-decoration {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 16px;
        margin-bottom: 30px;
      }

      .deco-line {
        width: 40px;
        height: 1px;
        background: linear-gradient(
          to right,
          transparent,
          rgba(255, 255, 255, 0.2)
        );
      }

      .deco-line:last-child {
        background: linear-gradient(
          to left,
          transparent,
          rgba(255, 255, 255, 0.2)
        );
      }

      .deco-symbol {
        font-family: "Playfair Display", serif;
        color: rgba(255, 255, 255, 0.15);
        font-size: 20px;
      }

      .login-title {
        font-family: "Playfair Display", serif;
        font-size: 32px;
        color: rgba(255, 255, 255, 0.9);
        font-weight: 400;
        margin-bottom: 8px;
        letter-spacing: 2px;
      }

      .login-subtitle {
        font-size: 12px;
        color: rgba(255, 255, 255, 0.3);
        letter-spacing: 4px;
        text-transform: uppercase;
      }

      /* 表单样式 */
      .form-group {
        margin-bottom: 28px;
        position: relative;
      }

      .form-label {
        display: block;
        font-size: 10px;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.35);
        margin-bottom: 10px;
        font-weight: 500;
        transition: color 0.3s ease;
      }

      .input-wrapper {
        position: relative;
      }

      .form-input {
        width: 100%;
        padding: 14px 0;
        padding-right: 40px;
        background: transparent;
        border: none;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        color: rgba(255, 255, 255, 0.9);
        font-size: 15px;
        font-family: "Inter", sans-serif;
        letter-spacing: 1px;
        outline: none;
        transition: all 0.4s ease;
      }

      .form-input::placeholder {
        color: rgba(255, 255, 255, 0.15);
        font-style: italic;
      }

      .form-input:focus {
        border-bottom-color: rgba(139, 92, 246, 0.5);
      }

      .form-input:focus + .input-line {
        transform: scaleX(1);
      }

      .form-input:focus ~ .input-icon {
        color: rgba(139, 92, 246, 0.6);
      }

      .input-line {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 2px;
        background: linear-gradient(to right, #667eea, #764ba2);
        transform: scaleX(0);
        transform-origin: left;
        transition: transform 0.4s cubic-bezier(0.23, 1, 0.32, 1);
      }

      .input-icon {
        position: absolute;
        right: 0;
        top: 50%;
        transform: translateY(-50%);
        color: rgba(255, 255, 255, 0.15);
        transition: color 0.3s ease;
      }

      .input-icon svg {
        width: 18px;
        height: 18px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* 记住我 & 忘记密码 */
      .form-options {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 36px;
      }

      .remember-me {
        display: flex;
        align-items: center;
        gap: 10px;
        cursor: pointer;
      }

      .custom-checkbox {
        width: 16px;
        height: 16px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        position: relative;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .custom-checkbox::after {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        width: 6px;
        height: 6px;
        background: linear-gradient(135deg, #667eea, #764ba2);
        transform: translate(-50%, -50%) scale(0);
        transition: transform 0.3s ease;
      }

      .checkbox-input {
        display: none;
      }

      .checkbox-input:checked + .custom-checkbox {
        border-color: rgba(139, 92, 246, 0.5);
      }

      .checkbox-input:checked + .custom-checkbox::after {
        transform: translate(-50%, -50%) scale(1);
      }

      .remember-text {
        font-size: 11px;
        color: rgba(255, 255, 255, 0.3);
        letter-spacing: 1px;
      }

      .forgot-link {
        font-size: 11px;
        color: rgba(255, 255, 255, 0.3);
        text-decoration: none;
        letter-spacing: 1px;
        position: relative;
        transition: color 0.3s ease;
      }

      .forgot-link::after {
        content: "";
        position: absolute;
        bottom: -2px;
        left: 0;
        width: 100%;
        height: 1px;
        background: rgba(255, 255, 255, 0.15);
        transform: scaleX(0);
        transform-origin: right;
        transition: transform 0.3s ease;
      }

      .forgot-link:hover {
        color: rgba(255, 255, 255, 0.6);
      }

      .forgot-link:hover::after {
        transform: scaleX(1);
        transform-origin: left;
      }

      /* 登录按钮 */
      .login-btn {
        width: 100%;
        padding: 16px;
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.12);
        color: rgba(255, 255, 255, 0.7);
        font-size: 11px;
        letter-spacing: 4px;
        text-transform: uppercase;
        cursor: pointer;
        position: relative;
        overflow: hidden;
        transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
        font-family: "Inter", sans-serif;
        font-weight: 500;
      }

      .login-btn::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, #667eea, #764ba2, #f5576c);
        opacity: 0;
        transition: opacity 0.5s ease;
      }

      .login-btn::after {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        width: 0;
        height: 0;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 50%;
        transform: translate(-50%, -50%);
        transition:
          width 0.6s ease,
          height 0.6s ease;
      }

      .login-btn:hover {
        border-color: transparent;
        color: rgba(255, 255, 255, 0.95);
        box-shadow: 0 10px 40px rgba(102, 126, 234, 0.2);
      }

      .login-btn:hover::before {
        opacity: 1;
      }

      .login-btn:active::after {
        width: 300px;
        height: 300px;
      }

      .login-btn span {
        position: relative;
        z-index: 1;
      }

      /* 分割线 */
      .divider {
        display: flex;
        align-items: center;
        gap: 20px;
        margin: 32px 0;
      }

      .divider-line {
        flex: 1;
        height: 1px;
        background: rgba(255, 255, 255, 0.06);
      }

      .divider-text {
        font-size: 10px;
        color: rgba(255, 255, 255, 0.2);
        letter-spacing: 2px;
        text-transform: uppercase;
      }

      /* 社交登录 */
      .social-login {
        display: flex;
        gap: 12px;
        margin-bottom: 36px;
      }

      .social-btn {
        flex: 1;
        padding: 14px;
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid rgba(255, 255, 255, 0.06);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
      }

      .social-btn:hover {
        background: rgba(255, 255, 255, 0.06);
        border-color: rgba(255, 255, 255, 0.12);
        transform: translateY(-2px);
      }

      .social-btn svg {
        width: 18px;
        height: 18px;
        fill: rgba(255, 255, 255, 0.4);
        transition: fill 0.3s ease;
      }

      .social-btn:hover svg {
        fill: rgba(255, 255, 255, 0.7);
      }

      /* 注册链接 */
      .register-link {
        text-align: center;
      }

      .register-text {
        font-size: 12px;
        color: rgba(255, 255, 255, 0.25);
        letter-spacing: 1px;
      }

      .register-text a {
        color: rgba(255, 255, 255, 0.5);
        text-decoration: none;
        margin-left: 4px;
        position: relative;
        transition: color 0.3s ease;
        font-weight: 500;
      }

      .register-text a::after {
        content: "";
        position: absolute;
        bottom: -2px;
        left: 0;
        width: 100%;
        height: 1px;
        background: linear-gradient(to right, #667eea, #764ba2);
        transform: scaleX(0);
        transform-origin: right;
        transition: transform 0.3s ease;
      }

      .register-text a:hover {
        color: rgba(255, 255, 255, 0.8);
      }

      .register-text a:hover::after {
        transform: scaleX(1);
        transform-origin: left;
      }

      /* 底部信息 */
      .footer-info {
        position: absolute;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        text-align: center;
      }

      .footer-info p {
        font-size: 9px;
        color: rgba(255, 255, 255, 0.12);
        letter-spacing: 2px;
      }

      /* 角落装饰 */
      .corner-deco {
        position: absolute;
        width: 30px;
        height: 30px;
      }

      .corner-deco::before,
      .corner-deco::after {
        content: "";
        position: absolute;
        background: rgba(255, 255, 255, 0.06);
      }

      .corner-tl {
        top: 25px;
        right: 25px;
      }

      .corner-tl::before {
        top: 0;
        left: 0;
        width: 1px;
        height: 100%;
      }

      .corner-tl::after {
        top: 0;
        left: 0;
        width: 100%;
        height: 1px;
      }

      .corner-br {
        bottom: 60px;
        left: 25px;
      }

      .corner-br::before {
        bottom: 0;
        right: 0;
        width: 1px;
        height: 100%;
      }

      .corner-br::after {
        bottom: 0;
        right: 0;
        width: 100%;
        height: 1px;
      }

      /* 粒子动画 */
      .particles {
        position: absolute;
        inset: 0;
        z-index: 1;
        overflow: hidden;
        pointer-events: none;
      }

      .particle {
        position: absolute;
        width: 2px;
        height: 2px;
        background: rgba(255, 255, 255, 0.15);
        border-radius: 50%;
        animation: particleFloat linear infinite;
      }

      @keyframes particleFloat {
        0% {
          transform: translateY(100vh) rotate(0deg);
          opacity: 0;
        }
        10% {
          opacity: 1;
        }
        90% {
          opacity: 1;
        }
        100% {
          transform: translateY(-100px) rotate(720deg);
          opacity: 0;
        }
      }

      /* 页面加载动画 */
      .login-container {
        animation: fadeSlideUp 0.8s ease-out;
      }

      .gallery-frame {
        animation: fadeSlideLeft 1s ease-out;
      }

      @keyframes fadeSlideUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes fadeSlideLeft {
        from {
          opacity: 0;
          transform: translateX(-30px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      /* 鼠标跟踪光效 */
      .cursor-glow {
        position: fixed;
        width: 300px;
        height: 300px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(139, 92, 246, 0.06) 0%,
          transparent 70%
        );
        pointer-events: none;
        z-index: 9999;
        transform: translate(-50%, -50%);
        transition: opacity 0.3s ease;
      }

      /* 密码显示切换 */
      .password-toggle {
        position: absolute;
        right: 0;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        color: rgba(255, 255, 255, 0.15);
        cursor: pointer;
        padding: 4px;
        transition: color 0.3s ease;
      }

      .password-toggle:hover {
        color: rgba(255, 255, 255, 0.4);
      }

      .password-toggle svg {
        width: 18px;
        height: 18px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* ===== 响应式 ===== */
      @media (max-width: 1024px) {
        .art-panel {
          display: none;
        }

        .login-panel {
          flex: 1;
          background: #0a0a0a;
        }

        .login-panel::before {
          display: none;
        }

        body {
          background: #0a0a0a;
        }
      }

      @media (max-width: 480px) {
        .login-container {
          padding: 30px 24px;
        }

        .login-title {
          font-size: 26px;
        }
      }

      /* ===== 滚动条样式 ===== */
      ::-webkit-scrollbar {
        width: 4px;
      }

      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.1);
      }

      /* 特殊输入效果 */
      .form-group.focused .form-label {
        color: rgba(139, 92, 246, 0.6);
      }

      /* 额外装饰 - 垂直文字 */
      .vertical-text {
        position: absolute;
        right: 20px;
        top: 50%;
        transform: translateY(-50%) rotate(90deg);
        z-index: 3;
        font-size: 9px;
        letter-spacing: 4px;
        color: rgba(255, 255, 255, 0.08);
        text-transform: uppercase;
        white-space: nowrap;
      }

      /* 画作切换动画 */
      .frame-inner {
        animation: artShimmer 4s ease-in-out infinite alternate;
      }

      @keyframes artShimmer {
        0% {
          filter: brightness(1) saturate(1);
        }
        100% {
          filter: brightness(1.05) saturate(1.1);
        }
      }
    </style>
  </head>
  <body>
    <!-- 鼠标光效 -->
    <div class="cursor-glow" id="cursorGlow"></div>

    <!-- ===== 左侧艺术面板 ===== -->
    <div class="art-panel">
      <!-- 动态背景 -->
      <div class="art-canvas">
        <div class="floating-shape shape-1"></div>
        <div class="floating-shape shape-2"></div>
        <div class="floating-shape shape-3"></div>
        <div class="floating-shape shape-4"></div>
      </div>

      <!-- 粒子效果 -->
      <div class="particles" id="particles"></div>

      <!-- 品牌标识 -->
      <div class="brand-watermark">
        <div class="brand-logo"></div>
        <span class="brand-name">ARTIVUS</span>
      </div>

      <!-- 垂直文字 -->
      <span class="vertical-text">Creative Space — Est. 2024</span>

      <!-- 艺术画框 -->
      <div class="gallery-frame" id="galleryFrame">
        <div class="frame-inner">
          <!-- 几何装饰 -->
          <div class="geo-line geo-line-1"></div>
          <div class="geo-line geo-line-2"></div>
          <div class="geo-line geo-line-3"></div>
          <div class="geo-line geo-line-4"></div>
          <div class="geo-circle"></div>
          <div class="geo-circle geo-circle-2"></div>
          <div class="geo-diamond"></div>

          <!-- 作品信息 -->
          <div class="artwork-info">
            <div class="artwork-number">No. 042 — Digital</div>
            <div class="artwork-title">Whispers of<br />the Cosmos</div>
            <div class="artwork-artist">by Elena Voss · 2024</div>
          </div>
        </div>
      </div>

      <!-- 画廊导航 -->
      <div class="gallery-nav">
        <div class="nav-dot active" data-index="0"></div>
        <div class="nav-dot" data-index="1"></div>
        <div class="nav-dot" data-index="2"></div>
        <div class="nav-dot" data-index="3"></div>
      </div>
    </div>

    <!-- ===== 右侧登录面板 ===== -->
    <div class="login-panel">
      <div class="texture-overlay"></div>

      <!-- 角落装饰 -->
      <div class="corner-deco corner-tl"></div>
      <div class="corner-deco corner-br"></div>

      <div class="login-container">
        <!-- 头部 -->
        <div class="login-header">
          <div class="header-decoration">
            <div class="deco-line"></div>
            <span class="deco-symbol">✦</span>
            <div class="deco-line"></div>
          </div>
          <h1 class="login-title">Welcome</h1>
          <p class="login-subtitle">进入你的创意空间</p>
        </div>

        <!-- 表单 -->
        <form id="loginForm" onsubmit="return handleLogin(event);">
          <div class="form-group" id="emailGroup">
            <label class="form-label">电子邮箱</label>
            <div class="input-wrapper">
              <input
                type="email"
                class="form-input"
                placeholder="your@email.com"
                autocomplete="email"
              />
              <div class="input-line"></div>
              <span class="input-icon">
                <svg viewBox="0 0 24 24">
                  <path
                    d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"
                  />
                  <polyline points="22,6 12,13 2,6" />
                </svg>
              </span>
            </div>
          </div>

          <div class="form-group" id="passwordGroup">
            <label class="form-label">密码</label>
            <div class="input-wrapper">
              <input
                type="password"
                class="form-input"
                id="passwordInput"
                placeholder="••••••••"
                autocomplete="current-password"
              />
              <div class="input-line"></div>
              <button
                type="button"
                class="password-toggle"
                onclick="togglePassword()"
              >
                <svg viewBox="0 0 24 24" id="eyeIcon">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
          </div>

          <div class="form-options">
            <label class="remember-me">
              <input type="checkbox" class="checkbox-input" />
              <div class="custom-checkbox"></div>
              <span class="remember-text">记住我</span>
            </label>
            <a href="#" class="forgot-link">忘记密码？</a>
          </div>

          <button type="submit" class="login-btn">
            <span>进入空间</span>
          </button>
        </form>

        <!-- 分割线 -->
        <div class="divider">
          <div class="divider-line"></div>
          <span class="divider-text">Or</span>
          <div class="divider-line"></div>
        </div>

        <!-- 社交登录 -->
        <div class="social-login">
          <button class="social-btn" title="Google">
            <svg viewBox="0 0 24 24">
              <path
                d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"
              />
              <path
                d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
              />
              <path
                d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
              />
              <path
                d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
              />
            </svg>
          </button>
          <button class="social-btn" title="Apple">
            <svg viewBox="0 0 24 24">
              <path
                d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"
              />
            </svg>
          </button>
          <button class="social-btn" title="WeChat">
            <svg viewBox="0 0 24 24">
              <path
                d="M8.691 2.188C3.891 2.188 0 5.476 0 9.53c0 2.212 1.17 4.203 3.002 5.55a.59.59 0 0 1 .213.665l-.39 1.48c-.019.07-.048.141-.048.213 0 .163.13.295.29.295a.326.326 0 0 0 .167-.054l1.903-1.114a.864.864 0 0 1 .717-.098 10.16 10.16 0 0 0 2.837.403c.276 0 .543-.027.811-.05-.857-2.578.157-4.972 1.932-6.446 1.703-1.415 3.882-1.98 5.853-1.838-.576-3.583-4.196-6.348-8.596-6.348zM5.785 5.991c.642 0 1.162.529 1.162 1.18a1.17 1.17 0 0 1-1.162 1.178A1.17 1.17 0 0 1 4.623 7.17c0-.651.52-1.18 1.162-1.18zm5.813 0c.642 0 1.162.529 1.162 1.18a1.17 1.17 0 0 1-1.162 1.178 1.17 1.17 0 0 1-1.162-1.178c0-.651.52-1.18 1.162-1.18zm5.34 2.867c-1.797-.052-3.746.512-5.28 1.786-1.72 1.428-2.687 3.72-1.78 6.22.942 2.453 3.666 4.229 6.884 4.229.826 0 1.622-.12 2.361-.336a.722.722 0 0 1 .598.082l1.584.926a.272.272 0 0 0 .14.047c.134 0 .24-.111.24-.247 0-.06-.023-.12-.038-.177l-.327-1.233a.582.582 0 0 1-.023-.156.49.49 0 0 1 .201-.398C23.024 18.48 24 16.82 24 14.98c0-3.21-2.931-5.837-7.062-6.122zM14.485 13.1c.535 0 .969.44.969.982a.976.976 0 0 1-.969.983.976.976 0 0 1-.969-.983c0-.542.434-.982.97-.982zm4.844 0c.535 0 .969.44.969.982a.976.976 0 0 1-.969.983.976.976 0 0 1-.969-.983c0-.542.434-.982.97-.982z"
              />
            </svg>
          </button>
        </div>

        <!-- 注册链接 -->
        <div class="register-link">
          <span class="register-text">
            还没有账号？<a href="#">创建账号</a>
          </span>
        </div>
      </div>

      <!-- 底部信息 -->
      <div class="footer-info">
        <p>© 2024 ARTIVUS · ALL RIGHTS RESERVED</p>
      </div>
    </div>

    <script>
      // ===== 鼠标跟踪光效 =====
      const cursorGlow = document.getElementById("cursorGlow");
      let mouseX = 0,
        mouseY = 0;
      let glowX = 0,
        glowY = 0;

      document.addEventListener("mousemove", (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
      });

      function animateGlow() {
        glowX += (mouseX - glowX) * 0.08;
        glowY += (mouseY - glowY) * 0.08;
        cursorGlow.style.left = glowX + "px";
        cursorGlow.style.top = glowY + "px";
        requestAnimationFrame(animateGlow);
      }
      animateGlow();

      // ===== 生成粒子 =====
      const particlesContainer = document.getElementById("particles");

      function createParticle() {
        const particle = document.createElement("div");
        particle.className = "particle";
        particle.style.left = Math.random() * 100 + "%";
        particle.style.width = Math.random() * 3 + 1 + "px";
        particle.style.height = particle.style.width;
        particle.style.animationDuration = Math.random() * 15 + 10 + "s";
        particle.style.animationDelay = Math.random() * 5 + "s";
        particle.style.opacity = Math.random() * 0.3;
        particlesContainer.appendChild(particle);
      }

      for (let i = 0; i < 30; i++) {
        createParticle();
      }

      // ===== 输入框焦点效果 =====
      document.querySelectorAll(".form-input").forEach((input) => {
        const group = input.closest(".form-group");

        input.addEventListener("focus", () => {
          group.classList.add("focused");
        });

        input.addEventListener("blur", () => {
          if (!input.value) {
            group.classList.remove("focused");
          }
        });
      });

      // ===== 密码显示切换 =====
      function togglePassword() {
        const input = document.getElementById("passwordInput");
        const icon = document.getElementById("eyeIcon");

        if (input.type === "password") {
          input.type = "text";
          icon.innerHTML = `
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                    <line x1="1" y1="1" x2="23" y2="23"/>
                `;
        } else {
          input.type = "password";
          icon.innerHTML = `
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                    <circle cx="12" cy="12" r="3"/>
                `;
        }
      }

      // ===== 画廊导航切换 =====
      const artworks = [
        {
          number: "No. 042 — Digital",
          title: "Whispers of<br>the Cosmos",
          artist: "by Elena Voss · 2024",
          gradient:
            "linear-gradient(135deg, #1a1a2e, #16213e, #0f3460, #533483, #e94560)",
        },
        {
          number: "No. 017 — Abstract",
          title: "Midnight<br>Reverie",
          artist: "by James Chen · 2024",
          gradient:
            "linear-gradient(135deg, #0c0c1d, #1b2838, #2d4059, #ea5455, #fee140)",
        },
        {
          number: "No. 089 — Ethereal",
          title: "Garden of<br>Lost Dreams",
          artist: "by Yuki Tanaka · 2024",
          gradient:
            "linear-gradient(135deg, #0d1b2a, #1b2a49, #324a5f, #a4c3b2, #f6fff8)",
        },
        {
          number: "No. 003 — Minimal",
          title: "Silence<br>Between Notes",
          artist: "by Mira Dubois · 2024",
          gradient:
            "linear-gradient(135deg, #1a1a2e, #2d2d44, #3d3d5c, #7b68ee, #e8d5b7)",
        },
      ];

      document.querySelectorAll(".nav-dot").forEach((dot) => {
        dot.addEventListener("click", function () {
          const index = parseInt(this.dataset.index);
          const artwork = artworks[index];

          // 更新活跃状态
          document
            .querySelectorAll(".nav-dot")
            .forEach((d) => d.classList.remove("active"));
          this.classList.add("active");

          // 更新作品信息
          const frameInner = document.querySelector(".frame-inner");
          frameInner.style.animation = "none";
          frameInner.offsetHeight; // 触发重排

          // 更新渐变背景
          frameInner.style.setProperty("--gradient", artwork.gradient);
          frameInner.querySelector("::before");

          document.querySelector(".artwork-number").textContent =
            artwork.number;
          document.querySelector(".artwork-title").innerHTML = artwork.title;
          document.querySelector(".artwork-artist").textContent =
            artwork.artist;

          // 更新背景渐变
          const style = document.createElement("style");
          style.textContent = `
                    .frame-inner::before {
                        background: ${artwork.gradient} !important;
                        background-size: 400% 400% !important;
                        animation: gradientShift 8s ease infinite !important;
                    }
                `;
          // 移除旧的动态样式
          const oldStyle = document.getElementById("dynamicStyle");
          if (oldStyle) oldStyle.remove();
          style.id = "dynamicStyle";
          document.head.appendChild(style);

          // 重新添加动画
          frameInner.style.animation =
            "artShimmer 4s ease-in-out infinite alternate";
        });
      });

      // ===== 画框3D效果 =====
      const galleryFrame = document.getElementById("galleryFrame");

      galleryFrame.addEventListener("mousemove", (e) => {
        const rect = galleryFrame.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const centerX = rect.width / 2;
        const centerY = rect.height / 2;

        const rotateX = ((y - centerY) / centerY) * -5;
        const rotateY = ((x - centerX) / centerX) * 5;

        galleryFrame.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
      });

      galleryFrame.addEventListener("mouseleave", () => {
        galleryFrame.style.transform =
          "perspective(1000px) rotateX(0) rotateY(0)";
      });

      // ===== 登录处理 =====
      function handleLogin(e) {
        e.preventDefault();

        const btn = document.querySelector(".login-btn");
        const originalText = btn.innerHTML;

        btn.innerHTML = "<span>验证中...</span>";
        btn.style.pointerEvents = "none";

        // 模拟登录
        setTimeout(() => {
          btn.innerHTML = "<span>✓ 欢迎回来</span>";
          btn.style.borderColor = "rgba(74, 222, 128, 0.4)";
          btn.style.background = "rgba(74, 222, 128, 0.1)";

          setTimeout(() => {
            btn.innerHTML = originalText;
            btn.style.pointerEvents = "";
            btn.style.borderColor = "";
            btn.style.background = "";
          }, 2000);
        }, 1500);

        return false;
      }

      // ===== 自动切换画作 =====
      let currentArtwork = 0;
      setInterval(() => {
        currentArtwork = (currentArtwork + 1) % artworks.length;
        const dots = document.querySelectorAll(".nav-dot");
        dots[currentArtwork].click();
      }, 6000);
    </script>
  </body>
</html>
