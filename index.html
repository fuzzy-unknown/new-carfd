<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ARTFLOW — 创意空间</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap");

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --bg-deep: #0a0a0f;
        --accent-1: #e8c547;
        --accent-2: #d4436e;
        --accent-3: #4a6cf7;
        --accent-4: #22c1c3;
        --text-primary: #f0ece2;
        --text-secondary: rgba(240, 236, 226, 0.6);
        --glass-bg: rgba(255, 255, 255, 0.04);
        --glass-border: rgba(255, 255, 255, 0.08);
      }

      body {
        min-height: 100vh;
        background: var(--bg-deep);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Inter", sans-serif;
        overflow: hidden;
        color: var(--text-primary);
      }

      /* ===== 背景画布 ===== */
      .bg-canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
      }

      /* 流体渐变球 */
      .orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(80px);
        opacity: 0;
        animation: orbAppear 2s ease-out forwards;
      }
      .orb-1 {
        width: 600px;
        height: 600px;
        background: radial-gradient(circle, var(--accent-2), transparent 70%);
        top: -10%;
        right: -5%;
        animation-delay: 0.3s;
      }
      .orb-2 {
        width: 500px;
        height: 500px;
        background: radial-gradient(circle, var(--accent-3), transparent 70%);
        bottom: -15%;
        left: -10%;
        animation-delay: 0.6s;
      }
      .orb-3 {
        width: 400px;
        height: 400px;
        background: radial-gradient(circle, var(--accent-1), transparent 70%);
        top: 40%;
        left: 50%;
        transform: translate(-50%, -50%);
        animation-delay: 0.9s;
      }
      .orb-4 {
        width: 350px;
        height: 350px;
        background: radial-gradient(circle, var(--accent-4), transparent 70%);
        top: 10%;
        left: 20%;
        animation-delay: 1.2s;
      }

      @keyframes orbAppear {
        0% {
          opacity: 0;
          transform: scale(0.5);
        }
        100% {
          opacity: 0.4;
          transform: scale(1);
        }
      }

      /* 浮动粒子 */
      .particles {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
        pointer-events: none;
      }
      .particle {
        position: absolute;
        width: 3px;
        height: 3px;
        background: var(--text-primary);
        border-radius: 50%;
        opacity: 0;
        animation: particleFloat linear infinite;
      }

      @keyframes particleFloat {
        0% {
          opacity: 0;
          transform: translateY(100vh) rotate(0deg);
        }
        10% {
          opacity: 0.6;
        }
        90% {
          opacity: 0.6;
        }
        100% {
          opacity: 0;
          transform: translateY(-10vh) rotate(720deg);
        }
      }

      /* 网格线背景 */
      .grid-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
          linear-gradient(
            90deg,
            rgba(255, 255, 255, 0.015) 1px,
            transparent 1px
          );
        background-size: 60px 60px;
        opacity: 0;
        animation: gridFadeIn 3s ease-out 0.5s forwards;
      }

      @keyframes gridFadeIn {
        to {
          opacity: 1;
        }
      }

      /* ===== 主容器 ===== */
      .main-container {
        position: relative;
        z-index: 10;
        display: flex;
        width: 1100px;
        max-width: 95vw;
        min-height: 650px;
        border-radius: 24px;
        overflow: hidden;
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        backdrop-filter: blur(40px);
        -webkit-backdrop-filter: blur(40px);
        box-shadow:
          0 40px 80px rgba(0, 0, 0, 0.5),
          inset 0 1px 0 rgba(255, 255, 255, 0.05);
        opacity: 0;
        transform: translateY(40px) scale(0.95);
        animation: containerEntry 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.5s
          forwards;
      }

      @keyframes containerEntry {
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      /* ===== 左侧艺术区域 ===== */
      .art-panel {
        flex: 1;
        position: relative;
        padding: 50px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        overflow: hidden;
        min-height: 650px;
      }

      .art-panel::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          135deg,
          rgba(212, 67, 110, 0.15),
          rgba(74, 108, 247, 0.1),
          rgba(232, 197, 71, 0.08)
        );
        z-index: 0;
      }

      /* 装饰性艺术元素 */
      .art-decoration {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
        overflow: hidden;
      }

      .art-circle {
        position: absolute;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.1);
        opacity: 0;
      }
      .art-circle-1 {
        width: 300px;
        height: 300px;
        top: -50px;
        right: -80px;
        animation: circleExpand 1.5s cubic-bezier(0.16, 1, 0.3, 1) 1s forwards;
      }
      .art-circle-2 {
        width: 200px;
        height: 200px;
        bottom: 60px;
        left: -40px;
        border-color: rgba(232, 197, 71, 0.2);
        animation: circleExpand 1.5s cubic-bezier(0.16, 1, 0.3, 1) 1.3s forwards;
      }
      .art-circle-3 {
        width: 150px;
        height: 150px;
        top: 50%;
        left: 60%;
        border-color: rgba(212, 67, 110, 0.15);
        animation: circleExpand 1.5s cubic-bezier(0.16, 1, 0.3, 1) 1.6s forwards;
      }

      @keyframes circleExpand {
        0% {
          opacity: 0;
          transform: scale(0);
        }
        100% {
          opacity: 1;
          transform: scale(1);
        }
      }

      /* 浮动几何 */
      .geo-shape {
        position: absolute;
        z-index: 2;
        opacity: 0;
      }

      .geo-triangle {
        width: 0;
        height: 0;
        border-left: 25px solid transparent;
        border-right: 25px solid transparent;
        border-bottom: 43px solid rgba(232, 197, 71, 0.15);
        top: 30%;
        right: 15%;
        animation:
          geoFloat 8s ease-in-out infinite,
          geoAppear 1s ease-out 1.8s forwards;
      }

      .geo-square {
        width: 30px;
        height: 30px;
        border: 1.5px solid rgba(74, 108, 247, 0.3);
        bottom: 30%;
        right: 25%;
        transform: rotate(45deg);
        animation:
          geoFloat2 10s ease-in-out infinite,
          geoAppear 1s ease-out 2s forwards;
      }

      .geo-dot {
        width: 8px;
        height: 8px;
        background: var(--accent-1);
        border-radius: 50%;
        top: 45%;
        left: 30%;
        animation:
          geoFloat 6s ease-in-out infinite,
          geoAppear 1s ease-out 2.2s forwards;
      }

      .geo-line {
        width: 60px;
        height: 1.5px;
        background: linear-gradient(90deg, var(--accent-2), transparent);
        top: 55%;
        right: 10%;
        animation:
          geoFloat2 7s ease-in-out infinite,
          geoAppear 1s ease-out 2.4s forwards;
      }

      @keyframes geoFloat {
        0%,
        100% {
          transform: translateY(0) rotate(0deg);
        }
        50% {
          transform: translateY(-20px) rotate(5deg);
        }
      }
      @keyframes geoFloat2 {
        0%,
        100% {
          transform: translateY(0) rotate(45deg);
        }
        50% {
          transform: translateY(-15px) rotate(50deg);
        }
      }
      @keyframes geoAppear {
        to {
          opacity: 1;
        }
      }

      /* 旋转的艺术环 */
      .art-ring {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 250px;
        height: 250px;
        z-index: 1;
        opacity: 0;
        animation: ringAppear 2s ease-out 1.5s forwards;
      }

      .art-ring svg {
        width: 100%;
        height: 100%;
        animation: rotateSlow 30s linear infinite;
      }

      @keyframes ringAppear {
        to {
          opacity: 0.6;
        }
      }

      @keyframes rotateSlow {
        to {
          transform: rotate(360deg);
        }
      }

      .art-content {
        position: relative;
        z-index: 5;
      }

      .brand {
        opacity: 0;
        transform: translateY(20px);
        animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 1.2s forwards;
      }

      .brand-logo {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 4px;
      }

      .logo-mark {
        width: 40px;
        height: 40px;
        position: relative;
      }

      .logo-mark::before {
        content: "";
        position: absolute;
        width: 100%;
        height: 100%;
        border: 2px solid var(--accent-1);
        border-radius: 50%;
        animation: logoPulse 3s ease-in-out infinite;
      }
      .logo-mark::after {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) rotate(45deg);
        width: 18px;
        height: 18px;
        background: var(--accent-1);
      }

      @keyframes logoPulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(1.1);
          opacity: 0.7;
        }
      }

      .brand-name {
        font-family: "Playfair Display", serif;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 4px;
        color: var(--text-primary);
      }

      .brand-sub {
        font-size: 11px;
        letter-spacing: 6px;
        text-transform: uppercase;
        color: var(--text-secondary);
        margin-left: 52px;
        margin-top: 2px;
      }

      .art-quote {
        position: relative;
        z-index: 5;
        margin-top: auto;
        opacity: 0;
        transform: translateY(20px);
        animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 1.6s forwards;
      }

      .quote-text {
        font-family: "Playfair Display", serif;
        font-size: 28px;
        font-weight: 400;
        font-style: italic;
        line-height: 1.5;
        color: var(--text-primary);
        margin-bottom: 20px;
      }

      .quote-text span {
        color: var(--accent-1);
      }

      .quote-author {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .author-line {
        width: 30px;
        height: 1px;
        background: var(--accent-1);
      }

      .author-name {
        font-size: 13px;
        letter-spacing: 2px;
        color: var(--text-secondary);
      }

      /* 底部画廊缩略图 */
      .mini-gallery {
        display: flex;
        gap: 10px;
        margin-top: 30px;
        opacity: 0;
        transform: translateY(20px);
        animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 2s forwards;
      }

      .gallery-thumb {
        width: 50px;
        height: 50px;
        border-radius: 8px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.1);
        position: relative;
        cursor: pointer;
        transition: all 0.4s ease;
      }

      .gallery-thumb::before {
        content: "";
        position: absolute;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
      }

      .gallery-thumb:nth-child(1)::before {
        background: linear-gradient(135deg, var(--accent-2), var(--accent-3));
      }
      .gallery-thumb:nth-child(2)::before {
        background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
      }
      .gallery-thumb:nth-child(3)::before {
        background: linear-gradient(135deg, var(--accent-3), var(--accent-4));
      }
      .gallery-thumb:nth-child(4)::before {
        background: linear-gradient(135deg, var(--accent-4), var(--accent-1));
      }

      .gallery-thumb:hover {
        transform: translateY(-4px) scale(1.1);
        border-color: rgba(255, 255, 255, 0.3);
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
      }

      /* ===== 右侧登录区域 ===== */
      .login-panel {
        width: 460px;
        padding: 50px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        position: relative;
        background: rgba(0, 0, 0, 0.3);
        border-left: 1px solid var(--glass-border);
      }

      .login-panel::before {
        content: "";
        position: absolute;
        top: 0;
        right: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(
          ellipse at top right,
          rgba(74, 108, 247, 0.05),
          transparent 60%
        );
        pointer-events: none;
      }

      .login-header {
        margin-bottom: 40px;
        opacity: 0;
        transform: translateX(30px);
        animation: slideLeft 0.8s cubic-bezier(0.16, 1, 0.3, 1) 1.4s forwards;
      }

      .login-welcome {
        font-size: 13px;
        letter-spacing: 4px;
        text-transform: uppercase;
        color: var(--accent-1);
        margin-bottom: 12px;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .welcome-line {
        width: 20px;
        height: 1px;
        background: var(--accent-1);
      }

      .login-title {
        font-family: "Playfair Display", serif;
        font-size: 36px;
        font-weight: 700;
        color: var(--text-primary);
        line-height: 1.2;
      }

      .login-subtitle {
        font-size: 14px;
        color: var(--text-secondary);
        margin-top: 8px;
        font-weight: 300;
      }

      /* 表单 */
      .login-form {
        display: flex;
        flex-direction: column;
        gap: 24px;
      }

      .form-group {
        position: relative;
        opacity: 0;
        transform: translateX(30px);
      }
      .form-group:nth-child(1) {
        animation: slideLeft 0.8s cubic-bezier(0.16, 1, 0.3, 1) 1.6s forwards;
      }
      .form-group:nth-child(2) {
        animation: slideLeft 0.8s cubic-bezier(0.16, 1, 0.3, 1) 1.8s forwards;
      }

      .form-label {
        display: block;
        font-size: 11px;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: var(--text-secondary);
        margin-bottom: 10px;
        transition: color 0.3s ease;
      }

      .input-wrapper {
        position: relative;
        display: flex;
        align-items: center;
      }

      .input-icon {
        position: absolute;
        left: 16px;
        width: 18px;
        height: 18px;
        color: var(--text-secondary);
        transition: color 0.3s ease;
        z-index: 2;
      }

      .form-input {
        width: 100%;
        padding: 16px 16px 16px 48px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 12px;
        color: var(--text-primary);
        font-family: "Inter", sans-serif;
        font-size: 15px;
        font-weight: 300;
        transition: all 0.4s ease;
        outline: none;
      }

      .form-input::placeholder {
        color: rgba(255, 255, 255, 0.2);
      }

      .form-input:focus {
        border-color: var(--accent-1);
        background: rgba(232, 197, 71, 0.03);
        box-shadow: 0 0 0 3px rgba(232, 197, 71, 0.08);
      }

      .form-input:focus ~ .input-line {
        width: 100%;
      }

      .form-group:focus-within .form-label {
        color: var(--accent-1);
      }

      .form-group:focus-within .input-icon {
        color: var(--accent-1);
      }

      .input-line {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 0;
        height: 2px;
        background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
        border-radius: 0 0 12px 12px;
        transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .password-toggle {
        position: absolute;
        right: 16px;
        background: none;
        border: none;
        color: var(--text-secondary);
        cursor: pointer;
        padding: 4px;
        transition: color 0.3s ease;
        z-index: 2;
      }

      .password-toggle:hover {
        color: var(--text-primary);
      }

      /* 选项区域 */
      .form-options {
        display: flex;
        justify-content: space-between;
        align-items: center;
        opacity: 0;
        transform: translateX(30px);
        animation: slideLeft 0.8s cubic-bezier(0.16, 1, 0.3, 1) 2s forwards;
      }

      .remember-me {
        display: flex;
        align-items: center;
        gap: 10px;
        cursor: pointer;
      }

      .custom-checkbox {
        width: 18px;
        height: 18px;
        border: 1.5px solid rgba(255, 255, 255, 0.15);
        border-radius: 5px;
        position: relative;
        transition: all 0.3s ease;
        flex-shrink: 0;
      }

      .custom-checkbox::after {
        content: "";
        position: absolute;
        top: 3px;
        left: 6px;
        width: 4px;
        height: 8px;
        border: solid var(--bg-deep);
        border-width: 0 2px 2px 0;
        transform: rotate(45deg) scale(0);
        transition: transform 0.3s ease;
      }

      .remember-me input {
        display: none;
      }

      .remember-me input:checked + .custom-checkbox {
        background: var(--accent-1);
        border-color: var(--accent-1);
      }

      .remember-me input:checked + .custom-checkbox::after {
        transform: rotate(45deg) scale(1);
      }

      .remember-text {
        font-size: 13px;
        color: var(--text-secondary);
      }

      .forgot-link {
        font-size: 13px;
        color: var(--accent-1);
        text-decoration: none;
        position: relative;
        transition: color 0.3s ease;
      }

      .forgot-link::after {
        content: "";
        position: absolute;
        bottom: -2px;
        left: 0;
        width: 0;
        height: 1px;
        background: var(--accent-1);
        transition: width 0.3s ease;
      }

      .forgot-link:hover::after {
        width: 100%;
      }

      /* 登录按钮 */
      .btn-login {
        position: relative;
        padding: 18px;
        background: linear-gradient(135deg, var(--accent-1), #d4a632);
        border: none;
        border-radius: 12px;
        color: var(--bg-deep);
        font-family: "Inter", sans-serif;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 3px;
        text-transform: uppercase;
        cursor: pointer;
        overflow: hidden;
        transition: all 0.4s ease;
        opacity: 0;
        transform: translateX(30px);
        animation: slideLeft 0.8s cubic-bezier(0.16, 1, 0.3, 1) 2.2s forwards;
      }

      .btn-login::before {
        content: "";
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.3),
          transparent
        );
        transition: left 0.6s ease;
      }

      .btn-login:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 40px rgba(232, 197, 71, 0.3);
      }

      .btn-login:hover::before {
        left: 100%;
      }

      .btn-login:active {
        transform: translateY(0);
      }

      .btn-login .btn-text {
        position: relative;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }

      .btn-arrow {
        transition: transform 0.3s ease;
      }

      .btn-login:hover .btn-arrow {
        transform: translateX(4px);
      }

      /* 分割线 */
      .divider {
        display: flex;
        align-items: center;
        gap: 16px;
        margin: 4px 0;
        opacity: 0;
        transform: translateX(30px);
        animation: slideLeft 0.8s cubic-bezier(0.16, 1, 0.3, 1) 2.4s forwards;
      }

      .divider-line {
        flex: 1;
        height: 1px;
        background: var(--glass-border);
      }

      .divider-text {
        font-size: 11px;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: var(--text-secondary);
      }

      /* 社交登录 */
      .social-login {
        display: flex;
        gap: 12px;
        opacity: 0;
        transform: translateX(30px);
        animation: slideLeft 0.8s cubic-bezier(0.16, 1, 0.3, 1) 2.6s forwards;
      }

      .social-btn {
        flex: 1;
        padding: 14px;
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        border-radius: 12px;
        color: var(--text-primary);
        cursor: pointer;
        transition: all 0.4s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font-family: "Inter", sans-serif;
        font-size: 13px;
        font-weight: 400;
      }

      .social-btn:hover {
        background: rgba(255, 255, 255, 0.08);
        border-color: rgba(255, 255, 255, 0.15);
        transform: translateY(-2px);
      }

      .social-btn svg {
        width: 18px;
        height: 18px;
      }

      /* 注册链接 */
      .signup-link {
        text-align: center;
        font-size: 13px;
        color: var(--text-secondary);
        opacity: 0;
        transform: translateX(30px);
        animation: slideLeft 0.8s cubic-bezier(0.16, 1, 0.3, 1) 2.8s forwards;
      }

      .signup-link a {
        color: var(--accent-1);
        text-decoration: none;
        font-weight: 500;
        margin-left: 4px;
        position: relative;
        transition: color 0.3s ease;
      }

      .signup-link a::after {
        content: "";
        position: absolute;
        bottom: -2px;
        left: 0;
        width: 100%;
        height: 1px;
        background: var(--accent-1);
        transform: scaleX(0);
        transition: transform 0.3s ease;
        transform-origin: right;
      }

      .signup-link a:hover::after {
        transform: scaleX(1);
        transform-origin: left;
      }

      /* ===== 动画 ===== */
      @keyframes slideUp {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes slideLeft {
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      /* 鼠标跟随光效 */
      .cursor-glow {
        position: fixed;
        width: 300px;
        height: 300px;
        background: radial-gradient(
          circle,
          rgba(232, 197, 71, 0.06),
          transparent 70%
        );
        border-radius: 50%;
        pointer-events: none;
        z-index: 5;
        transform: translate(-50%, -50%);
        transition: opacity 0.3s ease;
        opacity: 0;
      }

      /* 加载动画 */
      .loader-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: var(--bg-deep);
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 30px;
        animation: loaderExit 0.8s cubic-bezier(0.16, 1, 0.3, 1) 1.5s forwards;
      }

      @keyframes loaderExit {
        0% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          pointer-events: none;
        }
      }

      .loader-logo {
        display: flex;
        align-items: center;
        gap: 16px;
        animation: loaderPulse 1.5s ease-in-out infinite;
      }

      @keyframes loaderPulse {
        0%,
        100% {
          opacity: 0.5;
        }
        50% {
          opacity: 1;
        }
      }

      .loader-text {
        font-family: "Playfair Display", serif;
        font-size: 32px;
        font-weight: 700;
        letter-spacing: 8px;
        color: var(--text-primary);
      }

      .loader-bar {
        width: 200px;
        height: 2px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 2px;
        overflow: hidden;
      }

      .loader-bar-fill {
        height: 100%;
        background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
        border-radius: 2px;
        animation: loaderFill 1.2s ease-out forwards;
      }

      @keyframes loaderFill {
        0% {
          width: 0;
        }
        100% {
          width: 100%;
        }
      }

      /* 成功动画 */
      .success-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(10, 10, 15, 0.9);
        backdrop-filter: blur(20px);
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 20px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.5s ease;
      }

      .success-overlay.active {
        opacity: 1;
        pointer-events: all;
      }

      .success-check {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--accent-1), #d4a632);
        display: flex;
        align-items: center;
        justify-content: center;
        transform: scale(0);
        transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      .success-overlay.active .success-check {
        transform: scale(1);
      }

      .success-text {
        font-family: "Playfair Display", serif;
        font-size: 24px;
        color: var(--text-primary);
        opacity: 0;
        transform: translateY(10px);
        transition: all 0.5s ease 0.3s;
      }

      .success-overlay.active .success-text {
        opacity: 1;
        transform: translateY(0);
      }

      /* 输入框涟漪效果 */
      .input-ripple {
        position: absolute;
        top: 50%;
        left: 48px;
        width: 4px;
        height: 4px;
        background: var(--accent-1);
        border-radius: 50%;
        opacity: 0;
        transform: translate(-50%, -50%) scale(0);
        pointer-events: none;
      }

      .input-ripple.active {
        animation: inputRipple 0.6s ease-out forwards;
      }

      @keyframes inputRipple {
        0% {
          opacity: 0.5;
          transform: translate(-50%, -50%) scale(0);
        }
        100% {
          opacity: 0;
          transform: translate(-50%, -50%) scale(20);
        }
      }

      /* ===== 响应式 ===== */
      @media (max-width: 900px) {
        .main-container {
          flex-direction: column;
          width: 95vw;
          max-width: 480px;
          min-height: auto;
        }
        .art-panel {
          min-height: 280px;
          padding: 35px;
        }
        .login-panel {
          width: 100%;
          border-left: none;
          border-top: 1px solid var(--glass-border);
          padding: 35px;
        }
        .quote-text {
          font-size: 20px;
        }
        .art-ring {
          width: 160px;
          height: 160px;
        }
        .login-title {
          font-size: 28px;
        }
      }

      @media (max-width: 480px) {
        .art-panel {
          padding: 25px;
          min-height: 220px;
        }
        .login-panel {
          padding: 25px;
        }
        .social-login {
          flex-direction: column;
        }
      }

      /* 输入框打字光标动画 */
      .typing-cursor {
        display: inline-block;
        width: 1px;
        height: 18px;
        background: var(--accent-1);
        margin-left: 2px;
        animation: blink 1s step-end infinite;
      }

      @keyframes blink {
        50% {
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <!-- 加载遮罩 -->
    <div class="loader-overlay" id="loader">
      <div class="loader-logo">
        <div class="logo-mark"></div>
        <span class="loader-text">ARTFLOW</span>
      </div>
      <div class="loader-bar">
        <div class="loader-bar-fill"></div>
      </div>
    </div>

    <!-- 成功遮罩 -->
    <div class="success-overlay" id="successOverlay">
      <div class="success-check">
        <svg
          width="36"
          height="36"
          viewBox="0 0 24 24"
          fill="none"
          stroke="#0a0a0f"
          stroke-width="3"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </div>
      <div class="success-text">欢迎回到创意空间</div>
    </div>

    <!-- 鼠标跟随 -->
    <div class="cursor-glow" id="cursorGlow"></div>

    <!-- 背景 -->
    <div class="bg-canvas">
      <div class="orb orb-1" id="orb1"></div>
      <div class="orb orb-2" id="orb2"></div>
      <div class="orb orb-3" id="orb3"></div>
      <div class="orb orb-4" id="orb4"></div>
    </div>
    <div class="grid-overlay"></div>
    <div class="particles" id="particles"></div>

    <!-- 主容器 -->
    <div class="main-container" id="mainContainer">
      <!-- 左侧艺术区 -->
      <div class="art-panel">
        <div class="art-decoration">
          <div class="art-circle art-circle-1"></div>
          <div class="art-circle art-circle-2"></div>
          <div class="art-circle art-circle-3"></div>
          <div class="geo-shape geo-triangle"></div>
          <div class="geo-shape geo-square"></div>
          <div class="geo-shape geo-dot"></div>
          <div class="geo-shape geo-line"></div>

          <div class="art-ring">
            <svg viewBox="0 0 200 200">
              <defs>
                <linearGradient
                  id="ringGrad"
                  x1="0%"
                  y1="0%"
                  x2="100%"
                  y2="100%"
                >
                  <stop
                    offset="0%"
                    style="stop-color: #e8c547; stop-opacity: 0.6"
                  />
                  <stop
                    offset="50%"
                    style="stop-color: #d4436e; stop-opacity: 0.3"
                  />
                  <stop
                    offset="100%"
                    style="stop-color: #4a6cf7; stop-opacity: 0.6"
                  />
                </linearGradient>
              </defs>
              <circle
                cx="100"
                cy="100"
                r="90"
                fill="none"
                stroke="url(#ringGrad)"
                stroke-width="0.5"
                stroke-dasharray="8 12"
              />
              <circle
                cx="100"
                cy="100"
                r="70"
                fill="none"
                stroke="url(#ringGrad)"
                stroke-width="0.3"
                stroke-dasharray="4 8"
              />
              <circle
                cx="100"
                cy="100"
                r="50"
                fill="none"
                stroke="url(#ringGrad)"
                stroke-width="0.5"
                stroke-dasharray="2 14"
              />
            </svg>
          </div>
        </div>

        <div class="art-content brand">
          <div class="brand-logo">
            <div class="logo-mark"></div>
            <span class="brand-name">ARTFLOW</span>
          </div>
          <div class="brand-sub">Creative Studio</div>
        </div>

        <div class="art-quote">
          <p class="quote-text">
            "每一次登录，都是<br />
            一场<span>创意之旅</span>的开始"
          </p>
          <div class="quote-author">
            <div class="author-line"></div>
            <span class="author-name">ARTFLOW STUDIO · 2024</span>
          </div>
          <div class="mini-gallery">
            <div class="gallery-thumb"></div>
            <div class="gallery-thumb"></div>
            <div class="gallery-thumb"></div>
            <div class="gallery-thumb"></div>
          </div>
        </div>
      </div>

      <!-- 右侧登录区 -->
      <div class="login-panel">
        <div class="login-header">
          <div class="login-welcome">
            <span class="welcome-line"></span>
            <span>欢迎回来</span>
          </div>
          <h1 class="login-title">登录你的<br />创意空间</h1>
          <p class="login-subtitle">在这里，灵感没有边界</p>
        </div>

        <form class="login-form" id="loginForm" onsubmit="return false;">
          <div class="form-group">
            <label class="form-label">电子邮箱</label>
            <div class="input-wrapper">
              <svg
                class="input-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect x="2" y="4" width="20" height="16" rx="3" />
                <path d="M2 7l10 6 10-6" />
              </svg>
              <input
                type="email"
                class="form-input"
                placeholder="name@artflow.studio"
                autocomplete="email"
              />
              <div class="input-line"></div>
              <div class="input-ripple"></div>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">密码</label>
            <div class="input-wrapper">
              <svg
                class="input-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect x="3" y="11" width="18" height="11" rx="3" />
                <path d="M7 11V7a5 5 0 0110 0v4" />
                <circle cx="12" cy="16" r="1" />
              </svg>
              <input
                type="password"
                class="form-input"
                id="passwordInput"
                placeholder="输入你的密码"
                autocomplete="current-password"
                style="padding-right: 48px"
              />
              <button
                type="button"
                class="password-toggle"
                id="togglePassword"
                tabindex="-1"
              >
                <svg
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path
                    d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"
                    id="eyePath1"
                  />
                  <circle cx="12" cy="12" r="3" id="eyePath2" />
                </svg>
              </button>
              <div class="input-line"></div>
              <div class="input-ripple"></div>
            </div>
          </div>

          <div class="form-options">
            <label class="remember-me">
              <input type="checkbox" />
              <div class="custom-checkbox"></div>
              <span class="remember-text">记住我</span>
            </label>
            <a href="#" class="forgot-link">忘记密码？</a>
          </div>

          <button type="submit" class="btn-login" id="btnLogin">
            <span class="btn-text">
              进入工作室
              <svg
                class="btn-arrow"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M5 12h14M12 5l7 7-7 7" />
              </svg>
            </span>
          </button>

          <div class="divider">
            <div class="divider-line"></div>
            <span class="divider-text">或者</span>
            <div class="divider-line"></div>
          </div>

          <div class="social-login">
            <button type="button" class="social-btn">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path
                  d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"
                  fill="#4285F4"
                />
                <path
                  d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                  fill="#34A853"
                />
                <path
                  d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                  fill="#FBBC05"
                />
                <path
                  d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                  fill="#EA4335"
                />
              </svg>
              Google
            </button>
            <button type="button" class="social-btn">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path
                  d="M12 2C6.477 2 2 6.477 2 12c0 4.42 2.87 8.17 6.84 9.5.5.08.66-.23.66-.5v-1.69c-2.77.6-3.36-1.34-3.36-1.34-.46-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.87 1.52 2.34 1.07 2.91.83.09-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.92 0-1.11.38-2 1.03-2.71-.1-.25-.45-1.29.1-2.64 0 0 .84-.27 2.75 1.02.79-.22 1.65-.33 2.5-.33.85 0 1.71.11 2.5.33 1.91-1.29 2.75-1.02 2.75-1.02.55 1.35.2 2.39.1 2.64.65.71 1.03 1.6 1.03 2.71 0 3.82-2.34 4.66-4.57 4.91.36.31.69.92.69 1.85V21c0 .27.16.59.67.5C19.14 20.16 22 16.42 22 12A10 10 0 0012 2z"
                />
              </svg>
              GitHub
            </button>
          </div>

          <p class="signup-link">还没有账号？<a href="#">立即注册</a></p>
        </form>
      </div>
    </div>

    <script>
      // ===== 粒子生成 =====
      const particlesContainer = document.getElementById("particles");
      const particleCount = 30;

      for (let i = 0; i < particleCount; i++) {
        const particle = document.createElement("div");
        particle.className = "particle";
        particle.style.left = Math.random() * 100 + "%";
        particle.style.width = Math.random() * 3 + 1 + "px";
        particle.style.height = particle.style.width;
        particle.style.animationDuration = Math.random() * 15 + 10 + "s";
        particle.style.animationDelay = Math.random() * 15 + "s";
        particle.style.opacity = 0;
        particlesContainer.appendChild(particle);
      }

      // ===== 鼠标跟随光效 =====
      const cursorGlow = document.getElementById("cursorGlow");
      let mouseX = 0,
        mouseY = 0;
      let glowX = 0,
        glowY = 0;

      document.addEventListener("mousemove", (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
        cursorGlow.style.opacity = "1";
      });

      document.addEventListener("mouseleave", () => {
        cursorGlow.style.opacity = "0";
      });

      function animateGlow() {
        glowX += (mouseX - glowX) * 0.08;
        glowY += (mouseY - glowY) * 0.08;
        cursorGlow.style.left = glowX + "px";
        cursorGlow.style.top = glowY + "px";
        requestAnimationFrame(animateGlow);
      }
      animateGlow();

      // ===== 背景球体视差 =====
      const orbs = document.querySelectorAll(".orb");
      document.addEventListener("mousemove", (e) => {
        const x = (e.clientX / window.innerWidth - 0.5) * 2;
        const y = (e.clientY / window.innerHeight - 0.5) * 2;

        orbs.forEach((orb, i) => {
          const speed = (i + 1) * 8;
          orb.style.transform = `translate(${x * speed}px, ${y * speed}px)`;
        });
      });

      // ===== 密码显示/隐藏 =====
      const togglePassword = document.getElementById("togglePassword");
      const passwordInput = document.getElementById("passwordInput");
      let isPasswordVisible = false;

      togglePassword.addEventListener("click", () => {
        isPasswordVisible = !isPasswordVisible;
        passwordInput.type = isPasswordVisible ? "text" : "password";

        const eyeSvg = togglePassword.querySelector("svg");
        if (isPasswordVisible) {
          eyeSvg.innerHTML = `
                    <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/>
                    <line x1="1" y1="1" x2="23" y2="23"/>
                `;
        } else {
          eyeSvg.innerHTML = `
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                    <circle cx="12" cy="12" r="3"/>
                `;
        }
      });

      // ===== 输入框涟漪效果 =====
      document.querySelectorAll(".form-input").forEach((input) => {
        input.addEventListener("focus", function () {
          const ripple = this.parentElement.querySelector(".input-ripple");
          if (ripple) {
            ripple.classList.remove("active");
            void ripple.offsetWidth; // 触发回流
            ripple.classList.add("active");
          }
        });
      });

      // ===== 登录按钮效果 =====
      const btnLogin = document.getElementById("btnLogin");
      const loginForm = document.getElementById("loginForm");
      const successOverlay = document.getElementById("successOverlay");

      btnLogin.addEventListener("click", function (e) {
        e.preventDefault();

        // 按钮加载动画
        const btnText = this.querySelector(".btn-text");
        const originalText = btnText.innerHTML;

        btnText.innerHTML = `
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="animation: spin 1s linear infinite;">
                    <path d="M21 12a9 9 0 11-6.219-8.56"/>
                </svg>
                验证中...
            `;
        this.style.pointerEvents = "none";

        // 添加旋转动画
        const style = document.createElement("style");
        style.textContent =
          "@keyframes spin { to { transform: rotate(360deg); } }";
        document.head.appendChild(style);

        // 模拟登录
        setTimeout(() => {
          btnText.innerHTML = originalText;
          this.style.pointerEvents = "auto";

          // 显示成功
          successOverlay.classList.add("active");

          // 3秒后关闭
          setTimeout(() => {
            successOverlay.classList.remove("active");
          }, 3000);
        }, 2000);
      });

      // ===== 画廊缩略图悬停效果 =====
      document.querySelectorAll(".gallery-thumb").forEach((thumb, i) => {
        thumb.addEventListener("mouseenter", function () {
          this.style.transform = `translateY(-4px) scale(1.1) rotate(${(Math.random() - 0.5) * 10}deg)`;
        });
        thumb.addEventListener("mouseleave", function () {
          this.style.transform = "";
        });
      });

      // ===== 移除加载器 =====
      setTimeout(() => {
        const loader = document.getElementById("loader");
        loader.style.display = "none";
      }, 2500);

      // ===== 表单输入动效 =====
      document.querySelectorAll(".form-input").forEach((input) => {
        input.addEventListener("input", function () {
          if (this.value.length > 0) {
            this.style.letterSpacing = "0.5px";
          } else {
            this.style.letterSpacing = "normal";
          }
        });
      });

      // ===== 容器微交互（倾斜效果） =====
      const mainContainer = document.getElementById("mainContainer");

      mainContainer.addEventListener("mousemove", (e) => {
        const rect = mainContainer.getBoundingClientRect();
        const x = (e.clientX - rect.left) / rect.width - 0.5;
        const y = (e.clientY - rect.top) / rect.height - 0.5;

        mainContainer.style.transform = `
                perspective(1000px)
                rotateY(${x * 2}deg)
                rotateX(${-y * 2}deg)
            `;
      });

      mainContainer.addEventListener("mouseleave", () => {
        mainContainer.style.transform =
          "perspective(1000px) rotateY(0deg) rotateX(0deg)";
        mainContainer.style.transition = "transform 0.6s ease";
        setTimeout(() => {
          mainContainer.style.transition = "";
        }, 600);
      });
    </script>
  </body>
</html>
