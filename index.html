<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARTFLOW — 创意空间</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-deep: #0a0a0f;
            --accent-1: #e8c547;
            --accent-2: #d4436e;
            --accent-3: #4a6cf7;
            --accent-4: #22c1c3;
            --text-primary: #f0ece2;
            --text-secondary: rgba(240, 236, 226, 0.6);
            --glass-bg: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        body {
            min-height: 100vh;
            background: var(--bg-deep);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            color: var(--text-primary);
        }

        /* ===== 背景画布 ===== */
        .bg-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
        }

        /* 流体渐变球 */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0;
            animation: orbAppear 2s ease-out forwards;
        }
        .orb-1 {
            width: 600px; height: 600px;
            background: radial-gradient(circle, var(--accent-2), transparent 70%);
            top: -10%; right: -5%;
            animation-delay: 0.3s;
        }
        .orb-2 {
            width: 500px; height: 500px;
            background: radial-gradient(circle, var(--accent-3), transparent 70%);
            bottom: -15%; left: -10%;
            animation-delay: 0.6s;
        }
        .orb-3 {
            width: 400px; height: 400px;
            background: radial-gradient(circle, var(--accent-1), transparent 70%);
            top: 40%; left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: 0.9s;
        }
        .orb-4 {
            width: 350px; height: 350px;
            background: radial-gradient(circle, var(--accent-4), transparent 70%);
            top: 10%; left: 20%;
            animation-delay: 1.2s;
        }

        @keyframes orbAppear {
            0% { opacity: 0; transform: scale(0.5); }
            100% { opacity: 0.4; transform: scale(1); }
        }

        /* 浮动粒子 */
        .particles {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            pointer-events: none;
        }
        .particle {
            position: absolute;
            width: 3px; height: 3px;
            background: var(--text-primary);
            border-radius: 50%;
            opacity: 0;
            animation: particleFloat linear infinite;
        }

        @keyframes particleFloat {
            0% { opacity: 0; transform: translateY(100vh) rotate(0deg); }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% { opacity: 0; transform: translateY(-10vh) rotate(720deg); }
        }

        /* 网格线背景 */
        .grid-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            background-image:
                linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
            background-size: 60px 60px;
            opacity: 0;
            animation: gridFadeIn 3s ease-out 0.5s forwards;
        }

        @keyframes gridFadeIn {
            to { opacity: 1; }
        }

        /* ===== 主容器 ===== */
        .main-container {
            position: relative;
            z-index: 10;
            display: flex;
            width: 1100px;
            max-width: 95vw;
            min-height: 650px;
            border-radius: 24px;
            overflow: hidden;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            box-shadow:
                0 40px 80px rgba(0,0,0,0.5),
                inset 0 1px 0 rgba(255,255,255,0.05);
            opacity: 0;
            transform: translateY(40px) scale(0.95);
            animation: containerEntry 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;
        }

        @keyframes containerEntry {
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ===== 左侧艺术区域 ===== */
        .art-panel {
            flex: 1;
            position: relative;
            padding: 50px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            min-height: 650px;
        }

        .art-panel::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(135deg,
                rgba(212, 67, 110, 0.15),
                rgba(74, 108, 247, 0.1),
                rgba(232, 197, 71, 0.08));
            z-index: 0;
        }

        /* 装饰性艺术元素 */
        .art-decoration {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            overflow: hidden;
        }

        .art-circle {
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.1);
            opacity: 0;
        }
        .art-circle-1 {
            width: 300px; height: 300px;
            top: -50px; right: -80px;
            animation: circleExpand 1.5s cubic-bezier(0.16, 1, 0.3, 1) 1s forwards;
        }
        .art-circle-2 {
            width: 200px; height: 200px;
            bottom: 60px; left: -40px;
            border-color: rgba(232, 197, 71, 0.2);
            animation: circleExpand 1.5s cubic-bezier(0.16, 1, 0.3, 1) 1.3s forwards;
        }
        .art-circle-3 {
            width: 150px; height: 150px;
            top: 50%; left: 60%;
            border-color: rgba(212, 67, 110, 0.15);
            animation: circleExpand 1.5s cubic-bezier(0.16, 1, 0.3, 1) 1.6s forwards;
        }

        @keyframes circleExpand {
            0% { opacity: 0; transform: scale(0); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* 浮动几何 */
        .geo-shape {
            position: absolute;
            z-index: 2;
            opacity: 0;
        }

        .geo-triangle {
            width: 0; height: 0;
            border-left: 25px solid transparent;
            border-right: 25px solid transparent;
            border-bottom: 43px solid rgba(232, 197, 71, 0.15);
            top: 30%; right: 15%;
            animation: geoFloat 8s ease-in-out infinite, geoAppear 1s ease-out 1.8s forwards;
        }

        .geo-square {
            width: 30px; height: 30px;
            border: 1.5px solid rgba(74, 108, 247, 0.3);
            bottom: 30%; right: 25%;
            transform: rotate(45deg);
            animation: geoFloat2 10s ease-in-out infinite, geoAppear 1s ease-out 2s forwards;
        }

        .geo-dot {
            width: 8px; height: 8px;
            background: var(--accent-1);
            border-radius: 50%;
            top: 45%; left: 30%;
            animation: geoFloat 6s ease-in-out infinite, geoAppear 1s ease-out 2.2s forwards;
        }

        .geo-line {
            width: 60px; height: 1.5px;
            background: linear-gradient(90deg, var(--accent-2), transparent);
            top: 55%; right: 10%;
            animation: geoFloat2 7s ease-in-out infinite, geoAppear 1s ease-out 2.4s forwards;
        }

        @keyframes geoFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }
        @keyframes geoFloat2 {
            0%, 100% { transform: translateY(0) rotate(45deg); }
            50% { transform: translateY(-15px) rotate(50deg); }
        }
        @keyframes geoAppear {
            to { opacity: 1; }
        }

        /* 旋转的艺术环 */
        .art-ring {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 250px; height: 250px;
            z-index: 1;
            opacity: 0;
            animation: ringAppear 2s ease-out 1.5s forwards;
        }

        .art-ring svg {
            width: 100%; height: 100%;
            animation: rotateSlow 30s linear infinite;
        }

        @keyframes ringAppear {
            to { opacity: 0.6; }
        }

        @keyframes rotateSlow {
            to { transform: rotate(360deg); }
        }

        .art-content {
            position: relative;
            z-index: 5;
        }

        .brand {
            opacity: 0;
            transform: translateY(20px);
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 1.2s forwards;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 4px;
        }

        .logo-mark {
            width: 40px; height: 40px;
            position: relative;
        }

        .logo-mark::before {
            content: '';
            position: absolute;
            width: 100%; height: 100%;
            border: 2px solid var(--accent-1);
            border-radius: 50%;
            animation: logoPulse 3s ease-in-out infinite;
        }
        .logo-mark::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) rotate(45deg);
            width: 18px; height: 18px;
            background: var(--accent-1);
        }

        @keyframes logoPulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.7; }
        }

        .brand-name {
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 4px;
            color: var(--text-primary);
        }

        .brand-sub {
            font-size: 11px;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-left: 52px;
            margin-top: 2px;
        }

        .art-quote {
            position: relative;
            z-index: 5;
            margin-top: auto;
            opacity: 0;
            transform: translateY(20px);
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 1.6s forwards;
        }

        .quote-text {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            font-weight: 400;
            font-style: italic;
            line-height: 1.5;
            color: var(--text-primary);
            margin-bottom: 20px;
        }

        .quote-text span {
            color: var(--accent-1);
        }

        .quote-author {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .author-line {
            width: 30px; height: 1px;
            background: var(--accent-1);
        }

        .author-name {
            font-size: 13px;
            letter-spacing: 2px;
            color: var(--text-secondary);
        }

        /* 底部画廊缩略图 */
        .mini-gallery {
            display: flex;
            gap: 10px;
            margin-top: 30px;
            opacity: 0;
            transform: translateY(20px);
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 2s forwards;
        }

        .gallery-thumb {
            width: 50px; height: 50px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
            position: relative;
            cursor: pointer;
            transition: all 0.4s ease;
        }

        .gallery-thumb::before {
            content: '';
            position: absolute;
            width: 100%; height: 100%;
            top: 0; left: 0;
        }

        .gallery-thumb:nth-child(1)::before {
            background: linear-gradient(135deg, var(--accent-2), var(--accent-3));
        }
        .gallery-thumb:nth-child(2)::before {
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
        }
        .gallery-thumb:nth-child(3)::before {
            background: linear-gradient(135deg, var(--accent-3), var(--accent-4));
        }
        .gallery-thumb:nth-child(4)::before {
            background: linear-gradient(135deg, var(--accent-4), var(--accent-1));
        }

        .gallery-thumb:hover {
            transform: translateY(-4px) scale(1.1);
            border-color: rgba(255,255,255,0.3);
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }

        /* ===== 右侧登录区域 ===== */
        .login-panel {
            width: 460px;
            padding: 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            background: rgba(0,0,0,0.3);
            border-left: 1px solid var(--glass-border);
        }

        .login-panel::before {
            content: '';
            position: absolute;
            top: 0; right: 0;
            width: 100%; height: 100%;
            background: radial-gradient(ellipse at top right, rgba(74, 108, 247, 0.05), transparent 60%);
            pointer-events: none;
        }

        .login-header {
            margin-bottom: 40px;
            opacity: 0;
            transform: translateX(30px);
            animation: slideLeft 0.8s cubic-bezier(0.16, 1, 0.3, 1) 1.4s forwards;
        }

        .login-welcome {
            font-size: 13px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--accent-1);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .welcome-line {
            width: 20px; height: 1px;
            background: var(--accent-1);
        }

        .login-title {
            font-family: 'Playfair Display', serif;
            font-size: 36px;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.2;
        }

        .login-subtitle {
            font-size: 14px;
            color: var(--text-secondary);
            margin-top: 8px;
            font-weight: 300;
        }

        /* 表单 */
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .form-group {
            position: relative;
            opacity: 0;
            transform: translateX(30px);
        }
        .form-group:nth-child(1) {
            animation: slideLeft 0.8s cubic-bezier(0.16, 1, 0.3, 1) 1.6s forwards;
        }
        .form-group:nth-child(2) {
            animation: slideLeft 0.8s cubic-bezier(0.16, 1, 0.3, 1) 1.8s forwards;
        }

        .form-label {
