<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ARTIVUS — 创意空间</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Noto+Serif+SC:wght@400;700&family=Inter:wght@300;400;500&display=swap");

      :root {
        /* 暗色主题（默认） */
        --bg-primary: #0a0a0a;
        --bg-panel: #0f0f0f;
        --bg-input: transparent;
        --text-primary: rgba(255, 255, 255, 0.9);
        --text-secondary: rgba(255, 255, 255, 0.35);
        --text-muted: rgba(255, 255, 255, 0.15);
        --text-label: rgba(255, 255, 255, 0.35);
        --border-subtle: rgba(255, 255, 255, 0.06);
        --border-input: rgba(255, 255, 255, 0.08);
        --border-hover: rgba(255, 255, 255, 0.12);
        --social-bg: rgba(255, 255, 255, 0.02);
        --social-hover: rgba(255, 255, 255, 0.06);
        --social-icon: rgba(255, 255, 255, 0.4);
        --checkbox-border: rgba(255, 255, 255, 0.15);
        --deco-color: rgba(255, 255, 255, 0.06);
        --deco-symbol: rgba(255, 255, 255, 0.15);
        --deco-line-from: transparent;
        --deco-line-to: rgba(255, 255, 255, 0.2);
        --switch-text: rgba(255, 255, 255, 0.25);
        --switch-link: rgba(255, 255, 255, 0.5);
        --footer-text: rgba(255, 255, 255, 0.1);
        --btn-border: rgba(255, 255, 255, 0.12);
        --btn-text: rgba(255, 255, 255, 0.7);
        --forgot-text: rgba(255, 255, 255, 0.3);
        --texture-opacity: 0.02;
        --glow-color: rgba(139, 92, 246, 0.05);
        --panel-border-gradient: linear-gradient(
          to bottom,
          transparent,
          rgba(139, 92, 246, 0.3) 30%,
          rgba(244, 63, 94, 0.3) 70%,
          transparent
        );
        --theme-toggle-bg: rgba(255, 255, 255, 0.06);
        --theme-toggle-hover: rgba(255, 255, 255, 0.12);
        --theme-icon-color: rgba(255, 255, 255, 0.5);
        --brand-text: rgba(255, 255, 255, 0.8);
        --brand-border: rgba(255, 255, 255, 0.25);
        --vertical-text: rgba(255, 255, 255, 0.12);
        --artwork-num: rgba(255, 255, 255, 0.35);
        --artwork-title: rgba(255, 255, 255, 0.9);
        --artwork-artist: rgba(255, 255, 255, 0.35);
        --nav-dot-border: rgba(255, 255, 255, 0.3);
        --nav-dot-active: rgba(255, 255, 255, 0.8);
        --counter-text: rgba(255, 255, 255, 0.3);
        --counter-current: rgba(255, 255, 255, 0.8);
        --img-brightness: 0.55;
        --success-border: rgba(74, 222, 128, 0.4);
        --success-bg: rgba(74, 222, 128, 0.08);
      }

      [data-theme="light"] {
        --bg-primary: #f5f0eb;
        --bg-panel: #faf8f5;
        --bg-input: transparent;
        --text-primary: rgba(30, 30, 30, 0.9);
        --text-secondary: rgba(30, 30, 30, 0.45);
        --text-muted: rgba(30, 30, 30, 0.2);
        --text-label: rgba(30, 30, 30, 0.45);
        --border-subtle: rgba(30, 30, 30, 0.06);
        --border-input: rgba(30, 30, 30, 0.12);
        --border-hover: rgba(30, 30, 30, 0.18);
        --social-bg: rgba(30, 30, 30, 0.03);
        --social-hover: rgba(30, 30, 30, 0.07);
        --social-icon: rgba(30, 30, 30, 0.45);
        --checkbox-border: rgba(30, 30, 30, 0.18);
        --deco-color: rgba(30, 30, 30, 0.06);
        --deco-symbol: rgba(30, 30, 30, 0.15);
        --deco-line-from: transparent;
        --deco-line-to: rgba(30, 30, 30, 0.15);
        --switch-text: rgba(30, 30, 30, 0.4);
        --switch-link: rgba(30, 30, 30, 0.65);
        --footer-text: rgba(30, 30, 30, 0.15);
        --btn-border: rgba(30, 30, 30, 0.15);
        --btn-text: rgba(30, 30, 30, 0.7);
        --forgot-text: rgba(30, 30, 30, 0.4);
        --texture-opacity: 0.015;
        --glow-color: rgba(139, 92, 246, 0.04);
        --panel-border-gradient: linear-gradient(
          to bottom,
          transparent,
          rgba(139, 92, 246, 0.15) 30%,
          rgba(244, 63, 94, 0.15) 70%,
          transparent
        );
        --theme-toggle-bg: rgba(30, 30, 30, 0.05);
        --theme-toggle-hover: rgba(30, 30, 30, 0.1);
        --theme-icon-color: rgba(30, 30, 30, 0.5);
        --brand-text: rgba(255, 255, 255, 0.85);
        --brand-border: rgba(255, 255, 255, 0.3);
        --vertical-text: rgba(255, 255, 255, 0.15);
        --artwork-num: rgba(255, 255, 255, 0.45);
        --artwork-title: rgba(255, 255, 255, 0.95);
        --artwork-artist: rgba(255, 255, 255, 0.45);
        --nav-dot-border: rgba(255, 255, 255, 0.35);
        --nav-dot-active: rgba(255, 255, 255, 0.9);
        --counter-text: rgba(255, 255, 255, 0.35);
        --counter-current: rgba(255, 255, 255, 0.85);
        --img-brightness: 0.65;
        --success-border: rgba(22, 163, 74, 0.5);
        --success-bg: rgba(22, 163, 74, 0.06);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        background: var(--bg-primary);
        display: flex;
        font-family: "Inter", "Noto Serif SC", sans-serif;
        overflow: hidden;
        transition: background 0.6s ease;
      }

      /* ===== 左侧艺术面板 ===== */
      .art-panel {
        flex: 1;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      .art-panel::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(
            ellipse at 20% 50%,
            rgba(139, 92, 246, 0.1) 0%,
            transparent 50%
          ),
          radial-gradient(
            ellipse at 80% 20%,
            rgba(244, 63, 94, 0.06) 0%,
            transparent 50%
          );
        z-index: 2;
      }

      /* 幻灯片 */
      .slideshow {
        position: absolute;
        inset: 0;
        z-index: 0;
      }

      .slide {
        position: absolute;
        inset: 0;
        opacity: 0;
        transition: opacity 1.5s ease-in-out;
      }

      .slide.active {
        opacity: 1;
      }

      .slide img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: brightness(var(--img-brightness)) saturate(1.1);
        transition: filter 0.6s ease;
      }

      .slide-overlay {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0.3) 0%,
          rgba(0, 0, 0, 0.05) 40%,
          rgba(0, 0, 0, 0.05) 60%,
          rgba(0, 0, 0, 0.7) 100%
        );
      }

      /* 品牌 */
      .brand-watermark {
        position: absolute;
        top: 40px;
        left: 40px;
        z-index: 5;
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .brand-logo {
        width: 40px;
        height: 40px;
        border: 1.5px solid var(--brand-border);
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        transition: border-color 0.6s;
      }

      .brand-logo::before {
        content: "";
        width: 16px;
        height: 16px;
        background: linear-gradient(135deg, #667eea, #764ba2);
        border-radius: 50%;
      }

      .brand-logo::after {
        content: "";
        position: absolute;
        width: 10px;
        height: 10px;
        border-right: 1.5px solid var(--brand-border);
        border-bottom: 1.5px solid var(--brand-border);
        bottom: -5px;
        right: -5px;
        transition: border-color 0.6s;
      }

      .brand-name {
        font-family: "Playfair Display", serif;
        font-size: 18px;
        color: var(--brand-text);
        letter-spacing: 6px;
        transition: color 0.6s;
      }

      .vertical-text {
        position: absolute;
        right: 24px;
        top: 50%;
        transform: translateY(-50%) rotate(90deg);
        z-index: 5;
        font-size: 9px;
        letter-spacing: 4px;
        color: var(--vertical-text);
        text-transform: uppercase;
        white-space: nowrap;
        transition: color 0.6s;
      }

      .artwork-info-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 5;
        padding: 40px 50px;
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
      }

      .artwork-meta {
        max-width: 400px;
      }

      .artwork-number {
        font-family: "Playfair Display", serif;
        font-size: 10px;
        letter-spacing: 4px;
        color: var(--artwork-num);
        text-transform: uppercase;
        margin-bottom: 12px;
        transition: color 0.6s;
      }

      .artwork-title {
        font-family: "Playfair Display", serif;
        font-size: 30px;
        color: var(--artwork-title);
        line-height: 1.35;
        margin-bottom: 8px;
        font-style: italic;
        transition: color 0.6s;
      }

      .artwork-artist {
        font-size: 12px;
        color: var(--artwork-artist);
        letter-spacing: 2px;
        transition: color 0.6s;
      }

      .gallery-nav {
        display: flex;
        gap: 12px;
        align-items: center;
      }

      .nav-dot {
        width: 8px;
        height: 8px;
        border: 1px solid var(--nav-dot-border);
        border-radius: 50%;
        cursor: pointer;
        transition: all 0.4s ease;
      }

      .nav-dot.active {
        background: var(--nav-dot-active);
        border-color: var(--nav-dot-active);
        box-shadow: 0 0 12px rgba(255, 255, 255, 0.3);
        transform: scale(1.2);
      }

      .nav-dot:hover {
        background: rgba(255, 255, 255, 0.4);
      }

      .slide-counter {
        position: absolute;
        top: 40px;
        right: 60px;
        z-index: 5;
        font-family: "Playfair Display", serif;
        color: var(--counter-text);
        font-size: 13px;
        letter-spacing: 2px;
        transition: color 0.6s;
      }

      .slide-counter .current {
        color: var(--counter-current);
        font-size: 22px;
        transition: color 0.6s;
      }

      .slide-progress {
        position: absolute;
        bottom: 0;
        left: 0;
        height: 2px;
        background: linear-gradient(to right, #667eea, #764ba2);
        z-index: 6;
        animation: progressFill 6s linear infinite;
      }

      @keyframes progressFill {
        from {
          width: 0;
        }
        to {
          width: 100%;
        }
      }

      /* ===== 右侧面板 ===== */
      .login-panel {
        flex: 0;
        width: 580px;
        min-width: 580px;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        background: var(--bg-panel);
        border-left: 1px solid var(--border-subtle);
        overflow-y: auto;
        transition:
          background 0.6s ease,
          border-color 0.6s ease;
      }

      .login-panel::before {
        content: "";
        position: absolute;
        top: 0;
        left: -1px;
        width: 1px;
        height: 100%;
        background: var(--panel-border-gradient);
        transition: background 0.6s;
      }

      .texture-overlay {
        position: absolute;
        inset: 0;
        opacity: var(--texture-opacity);
        background-image:
          radial-gradient(circle at 25% 25%, currentColor 1px, transparent 1px),
          radial-gradient(circle at 75% 75%, currentColor 1px, transparent 1px);
        background-size: 50px 50px;
        pointer-events: none;
        color: var(--text-primary);
        transition: opacity 0.6s;
      }

      .login-container {
        width: 100%;
        max-width: 420px;
        padding: 50px 40px;
        position: relative;
        z-index: 2;
        animation: fadeSlideUp 0.8s ease-out;
      }

      @keyframes fadeSlideUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* 角落装饰 */
      .corner-deco {
        position: absolute;
        width: 30px;
        height: 30px;
      }

      .corner-deco::before,
      .corner-deco::after {
        content: "";
        position: absolute;
        background: var(--deco-color);
        transition: background 0.6s;
      }

      .corner-tl {
        top: 25px;
        right: 25px;
      }
      .corner-tl::before {
        top: 0;
        left: 0;
        width: 1px;
        height: 100%;
      }
      .corner-tl::after {
        top: 0;
        left: 0;
        width: 100%;
        height: 1px;
      }

      .corner-br {
        bottom: 60px;
        left: 25px;
      }
      .corner-br::before {
        bottom: 0;
        right: 0;
        width: 1px;
        height: 100%;
      }
      .corner-br::after {
        bottom: 0;
        right: 0;
        width: 100%;
        height: 1px;
      }

      /* ===== 日夜切换按钮 ===== */
      .theme-toggle {
        position: absolute;
        top: 28px;
        right: 28px;
        z-index: 10;
        width: 44px;
        height: 44px;
        border: none;
        background: var(--theme-toggle-bg);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.4s ease;
        border-radius: 0;
      }

      .theme-toggle:hover {
        background: var(--theme-toggle-hover);
        transform: rotate(15deg);
      }

      .theme-toggle svg {
        width: 20px;
        height: 20px;
        stroke: var(--theme-icon-color);
        fill: none;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        transition: all 0.4s ease;
      }

      .theme-toggle .icon-moon {
        display: block;
      }
      .theme-toggle .icon-sun {
        display: none;
      }

      [data-theme="light"] .theme-toggle .icon-moon {
        display: none;
      }
      [data-theme="light"] .theme-toggle .icon-sun {
        display: block;
      }

      /* 头部 */
      .login-header {
        margin-bottom: 40px;
        text-align: center;
      }

      .header-decoration {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 16px;
        margin-bottom: 28px;
      }

      .deco-line {
        width: 40px;
        height: 1px;
        background: linear-gradient(
          to right,
          var(--deco-line-from),
          var(--deco-line-to)
        );
        transition: background 0.6s;
      }

      .deco-line:last-child {
        background: linear-gradient(
          to left,
          var(--deco-line-from),
          var(--deco-line-to)
        );
      }

      .deco-symbol {
        font-family: "Playfair Display", serif;
        color: var(--deco-symbol);
        font-size: 20px;
        transition: color 0.6s;
      }

      .login-title {
        font-family: "Playfair Display", serif;
        font-size: 32px;
        color: var(--text-primary);
        font-weight: 400;
        margin-bottom: 8px;
        letter-spacing: 2px;
        transition: all 0.5s ease;
      }

      .login-subtitle {
        font-size: 12px;
        color: var(--text-secondary);
        letter-spacing: 3px;
        text-transform: uppercase;
        transition: all 0.5s ease;
      }

      /* ===== 表单切换 ===== */
      .form-wrapper {
        position: relative;
        overflow: hidden;
      }

      .form-view {
        transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
      }

      .form-view.login-view {
        opacity: 1;
        transform: translateX(0);
        position: relative;
        visibility: visible;
      }

      .form-view.register-view {
        opacity: 0;
        transform: translateX(40px);
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .form-wrapper.show-register .form-view.login-view {
        opacity: 0;
        transform: translateX(-40px);
        position: absolute;
        visibility: hidden;
        pointer-events: none;
      }

      .form-wrapper.show-register .form-view.register-view {
        opacity: 1;
        transform: translateX(0);
        position: relative;
        visibility: visible;
        pointer-events: all;
      }

      /* 表单元素 */
      .form-group {
        margin-bottom: 24px;
        position: relative;
      }

      .form-label {
        display: block;
        font-size: 10px;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: var(--text-label);
        margin-bottom: 10px;
        font-weight: 500;
        transition: color 0.3s ease;
      }

      .input-wrapper {
        position: relative;
      }

      .form-input {
        width: 100%;
        padding: 14px 0;
        padding-right: 40px;
        background: var(--bg-input);
        border: none;
        border-bottom: 1px solid var(--border-input);
        color: var(--text-primary);
        font-size: 15px;
        font-family: "Inter", sans-serif;
        letter-spacing: 1px;
        outline: none;
        transition: all 0.4s ease;
      }

      .form-input::placeholder {
        color: var(--text-muted);
        font-style: italic;
      }

      .form-input:focus {
        border-bottom-color: rgba(139, 92, 246, 0.5);
      }

      .form-input:focus + .input-line {
        transform: scaleX(1);
      }

      .form-input:focus ~ .input-icon {
        color: rgba(139, 92, 246, 0.6);
      }

      .input-line {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 2px;
        background: linear-gradient(to right, #667eea, #764ba2);
        transform: scaleX(0);
        transform-origin: left;
        transition: transform 0.4s cubic-bezier(0.23, 1, 0.32, 1);
      }

      .input-icon {
        position: absolute;
        right: 0;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-muted);
        transition: color 0.3s ease;
      }

      .input-icon svg {
        width: 18px;
        height: 18px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .password-toggle {
        position: absolute;
        right: 0;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        color: var(--text-muted);
        cursor: pointer;
        padding: 4px;
        transition: color 0.3s ease;
      }

      .password-toggle:hover {
        color: var(--text-secondary);
      }

      .password-toggle svg {
        width: 18px;
        height: 18px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* 选项行 */
      .form-options {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 32px;
      }

      .remember-me {
        display: flex;
        align-items: center;
        gap: 10px;
        cursor: pointer;
      }

      .custom-checkbox {
        width: 16px;
        height: 16px;
        border: 1px solid var(--checkbox-border);
        position: relative;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .custom-checkbox::after {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        width: 6px;
        height: 6px;
        background: linear-gradient(135deg, #667eea, #764ba2);
        transform: translate(-50%, -50%) scale(0);
        transition: transform 0.3s ease;
      }

      .checkbox-input {
        display: none;
      }

      .checkbox-input:checked + .custom-checkbox {
        border-color: rgba(139, 92, 246, 0.5);
      }

      .checkbox-input:checked + .custom-checkbox::after {
        transform: translate(-50%, -50%) scale(1);
      }

      .remember-text,
      .terms-text {
        font-size: 11px;
        color: var(--forgot-text);
        letter-spacing: 1px;
        transition: color 0.6s;
      }

      .terms-text a {
        color: var(--switch-link);
        text-decoration: none;
        border-bottom: 1px solid var(--border-input);
        transition: all 0.3s;
      }

      .terms-text a:hover {
        color: var(--text-primary);
        border-bottom-color: var(--text-secondary);
      }

      .forgot-link {
        font-size: 11px;
        color: var(--forgot-text);
        text-decoration: none;
        letter-spacing: 1px;
        position: relative;
        transition: color 0.3s ease;
      }

      .forgot-link::after {
        content: "";
        position: absolute;
        bottom: -2px;
        left: 0;
        width: 100%;
        height: 1px;
        background: var(--text-muted);
        transform: scaleX(0);
        transform-origin: right;
        transition: transform 0.3s ease;
      }

      .forgot-link:hover {
        color: var(--text-secondary);
      }
      .forgot-link:hover::after {
        transform: scaleX(1);
        transform-origin: left;
      }

      /* 按钮 */
      .submit-btn {
        width: 100%;
        padding: 16px;
        background: transparent;
        border: 1px solid var(--btn-border);
        color: var(--btn-text);
        font-size: 11px;
        letter-spacing: 4px;
        text-transform: uppercase;
        cursor: pointer;
        position: relative;
        overflow: hidden;
        transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
        font-family: "Inter", sans-serif;
        font-weight: 500;
      }

      .submit-btn::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, #667eea, #764ba2, #f5576c);
        opacity: 0;
        transition: opacity 0.5s ease;
      }

      .submit-btn:hover {
        border-color: transparent;
        color: rgba(255, 255, 255, 0.95);
        box-shadow: 0 10px 40px rgba(102, 126, 234, 0.25);
      }

      .submit-btn:hover::before {
        opacity: 1;
      }

      .submit-btn::after {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        width: 0;
        height: 0;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 50%;
        transform: translate(-50%, -50%);
        transition:
          width 0.6s ease,
          height 0.6s ease;
      }

      .submit-btn:active::after {
        width: 400px;
        height: 400px;
      }

      .submit-btn span {
        position: relative;
        z-index: 1;
      }

      /* 分割线 */
      .divider {
        display: flex;
        align-items: center;
        gap: 20px;
        margin: 28px 0;
      }

      .divider-line {
        flex: 1;
        height: 1px;
        background: var(--border-subtle);
        transition: background 0.6s;
      }

      .divider-text {
        font-size: 10px;
        color: var(--text-muted);
        letter-spacing: 2px;
        text-transform: uppercase;
        transition: color 0.6s;
      }

      /* 社交登录 */
      .social-login {
        display: flex;
        gap: 12px;
        margin-bottom: 32px;
      }

      .social-btn {
        flex: 1;
        padding: 14px;
        background: var(--social-bg);
        border: 1px solid var(--border-subtle);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
      }

      .social-btn:hover {
        background: var(--social-hover);
        border-color: var(--border-hover);
        transform: translateY(-2px);
      }

      .social-btn svg {
        width: 18px;
        height: 18px;
        fill: var(--social-icon);
        transition: fill 0.3s ease;
      }

      .social-btn:hover svg {
        fill: var(--text-primary);
      }

      /* 切换链接 */
      .switch-link {
        text-align: center;
      }

      .switch-text {
        font-size: 12px;
        color: var(--switch-text);
        letter-spacing: 1px;
        transition: color 0.6s;
      }

      .switch-text a {
        color: var(--switch-link);
        text-decoration: none;
        margin-left: 4px;
        position: relative;
        transition: color 0.3s ease;
        font-weight: 500;
        cursor: pointer;
      }

      .switch-text a::after {
        content: "";
        position: absolute;
        bottom: -2px;
        left: 0;
        width: 100%;
        height: 1px;
        background: linear-gradient(to right, #667eea, #764ba2);
        transform: scaleX(0);
        transform-origin: right;
        transition: transform 0.3s ease;
      }

      .switch-text a:hover {
        color: var(--text-primary);
      }
      .switch-text a:hover::after {
        transform: scaleX(1);
        transform-origin: left;
      }

      /* 底部 */
      .footer-info {
        position: absolute;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        text-align: center;
        white-space: nowrap;
      }

      .footer-info p {
        font-size: 9px;
        color: var(--footer-text);
        letter-spacing: 2px;
        transition: color 0.6s;
      }

      /* 鼠标光效 */
      .cursor-glow {
        position: fixed;
        width: 300px;
        height: 300px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          var(--glow-color) 0%,
          transparent 70%
        );
        pointer-events: none;
        z-index: 9999;
        transform: translate(-50%, -50%);
        transition: background 0.6s;
      }

      .form-group.focused .form-label {
        color: rgba(139, 92, 246, 0.6);
      }

      @media (max-width: 1100px) {
        .art-panel {
          display: none;

          flex: 1;
          width: 100%;

        }
        .login-panel {

        }
      }

      ::-webkit-scrollbar {
        width: 4px;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border-input);
      }
    </style>

    <script>
      // ===== 鼠标光效 =====
      const cursorGlow = document.getElementById("cursorGlow");
      let mouseX = 0,
        mouseY = 0,
        glowX = 0,
        glowY = 0;
      document.addEventListener("mousemove", (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
      });
      (function animateGlow() {
        glowX += (mouseX - glowX) * 0.08;
        glowY += (mouseY - glowY) * 0.08;
        cursorGlow.style.left = glowX + "px";
        cursorGlow.style.top = glowY + "px";
        requestAnimationFrame(animateGlow);
      })();

      // ===== 输入框焦点 =====
      document.addEventListener("focusin", (e) => {
        if (e.target.classList.contains("form-input"))
          e.target.closest(".form-group").classList.add("focused");
      });
      document.addEventListener("focusout", (e) => {
        if (e.target.classList.contains("form-input") && !e.target.value)
          e.target.closest(".form-group").classList.remove("focused");
      });

      // ===== 密码切换 =====
      function togglePassword(id, btn) {
        const input = document.getElementById(id);
        const svg = btn.querySelector("svg");
        if (input.type === "password") {
          input.type = "text";
          svg.innerHTML =
            '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
        } else {
          input.type = "password";
          svg.innerHTML =
            '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
        }
      }

      // ===== 表单切换 =====
      const formWrapper = document.getElementById("formWrapper");
      const formTitle = document.getElementById("formTitle");
      const formSubtitle = document.getElementById("formSubtitle");

      function animateHeader(title, subtitle) {
        formTitle.style.opacity = "0";
        formTitle.style.transform = "translateY(-10px)";
        formSubtitle.style.opacity = "0";
        setTimeout(() => {
          formTitle.textContent = title;
          formSubtitle.textContent = subtitle;
          formTitle.style.opacity = "1";
          formTitle.style.transform = "translateY(0)";
          formSubtitle.style.opacity = "1";
        }, 150);
      }

      function showRegister() {
        formWrapper.classList.add("show-register");
        animateHeader("Join Us", "创建你的创意空间");
      }

      function showLogin() {
        formWrapper.classList.remove("show-register");
        animateHeader("Welcome Back", "登录你的创意空间");
      }

      // ===== 日夜切换 =====
      const themeToggle = document.getElementById("themeToggle");
      const html = document.documentElement;

      // 检测系统偏好
      const prefersDark = window.matchMedia("(prefers-color-scheme: dark)");
      const savedTheme = localStorage.getItem("artivus-theme");
      if (savedTheme) {
        html.setAttribute("data-theme", savedTheme);
      } else if (!prefersDark.matches) {
        html.setAttribute("data-theme", "light");
      }

      themeToggle.addEventListener("click", () => {
        const current = html.getAttribute("data-theme");
        const next = current === "light" ? "dark" : "light";
        if (next === "dark") {
          html.removeAttribute("data-theme");
        } else {
          html.setAttribute("data-theme", "light");
        }
        localStorage.setItem("artivus-theme", next);
      });

      // ===== 幻灯片 =====
      const artworks = [
        {
          number: "No. 042 — Oil on Canvas",
          title: "Whispers of<br>the Cosmos",
          artist: "by Elena Voss · 2024",
        },
        {
          number: "No. 017 — Mixed Media",
          title: "Midnight<br>Reverie",
          artist: "by James Chen · 2024",
        },
        {
          number: "No. 089 — Digital Art",
          title: "Garden of<br>Lost Dreams",
          artist: "by Yuki Tanaka · 2024",
        },
        {
          number: "No. 003 — Photography",
          title: "Silence Between<br>the Notes",
          artist: "by Mira Dubois · 2024",
        },
      ];

      const slides = document.querySelectorAll(".slide");
      const dots = document.querySelectorAll(".nav-dot");
      const progressBar = document.getElementById("slideProgress");
      let currentSlide = 0;
      let slideInterval;

      function goToSlide(i) {
        slides.forEach((s) => s.classList.remove("active"));
        dots.forEach((d) => d.classList.remove("active"));
        slides[i].classList.add("active");
        dots[i].classList.add("active");
        document.getElementById("artworkNumber").textContent =
          artworks[i].number;
        document.getElementById("artworkTitle").innerHTML = artworks[i].title;
        document.getElementById("artworkArtist").textContent =
          artworks[i].artist;
        document.getElementById("slideCurrentNum").textContent = String(
          i + 1,
        ).padStart(2, "0");
        progressBar.style.animation = "none";
        progressBar.offsetHeight;
        progressBar.style.animation = "progressFill 6s linear infinite";
        currentSlide = i;
      }

      function nextSlide() {
        goToSlide((currentSlide + 1) % slides.length);
      }

      dots.forEach((dot) => {
        dot.addEventListener("click", function () {
          clearInterval(slideInterval);
          goToSlide(parseInt(this.dataset.index));
          slideInterval = setInterval(nextSlide, 6000);
        });
      });

      slideInterval = setInterval(nextSlide, 6000);

      // ===== 登录 =====
      function handleLogin(e) {
        e.preventDefault();
        const btn = e.target.querySelector(".submit-btn");
        const orig = btn.innerHTML;
        btn.innerHTML = "<span>验证中...</span>";
        btn.style.pointerEvents = "none";
        setTimeout(() => {
          btn.innerHTML = "<span>✓ 欢迎回来</span>";
          btn.style.borderColor = "var(--success-border)";
          btn.style.background = "var(--success-bg)";
          setTimeout(() => {
            btn.innerHTML = orig;
            btn.style.pointerEvents = "";
            btn.style.borderColor = "";
            btn.style.background = "";
          }, 2000);
        }, 1500);
        return false;
      }

      // ===== 注册 =====
      function handleRegister(e) {
        e.preventDefault();
        const btn = e.target.querySelector(".submit-btn");
        const orig = btn.innerHTML;
        btn.innerHTML = "<span>创建中...</span>";
        btn.style.pointerEvents = "none";
        setTimeout(() => {
          btn.innerHTML = "<span>✓ 创建成功</span>";
          btn.style.borderColor = "var(--success-border)";
          btn.style.background = "var(--success-bg)";
          setTimeout(() => {
            btn.innerHTML = orig;
            btn.style.pointerEvents = "";
            btn.style.borderColor = "";
            btn.style.background = "";
            showLogin();
          }, 1500);
        }, 1500);
        return false;
      }
    </script>
  </body>
</html>
